  var VAZIO = {tela:0, iG:0, iD:0, guiado:{}, desafio:{}, texto:""};
  var S = JSON.parse(JSON.stringify(VAZIO));
  try{ var raw = localStorage.getItem(KEY); if(raw){ S = Object.assign(S, JSON.parse(raw)); } }catch(e){}
  function salva(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

  var el = function(t,c,x){ var n=document.createElement(t); if(c) n.className=c; if(x!=null) n.textContent=x; return n; };
  var tela = document.getElementById("tela");
  var TELAS = [gancho, regra, treino, desafio, explicacao, fim];

  function rota(){
    var ul = document.getElementById("rota"); ul.innerHTML="";
    for(var i=0;i<TELAS.length;i++){
      var li = el("li"); li.appendChild(el("i"));
      if(i < S.tela) li.setAttribute("data-on","");
      if(i === S.tela) li.setAttribute("data-now","");
      ul.appendChild(li);
    }
  }
  function vai(n){ S.tela = n; salva(); render(); window.scrollTo(0,0); }
  function render(){ rota(); tela.innerHTML=""; tela.appendChild(TELAS[S.tela]()); }

  function card(){ var c = el("div","card"); for(var i=0;i<arguments.length;i++) c.appendChild(arguments[i]); return c; }
  function eyebrow(t){ return el("div","eyebrow",t); }
  function botao(t,fn){ var b = el("button","go",t); b.addEventListener("click",fn); return b; }

  function navbar(rotulo, voltar){
    var n = el("div","nav");
    if(voltar){
      var b = el("button","ghost","← Voltar");
      b.addEventListener("click", function(){ voltar(); window.scrollTo(0,0); });
      n.appendChild(b);
    } else n.appendChild(el("span"));
    n.appendChild(el("span","contador", rotulo));
    return n;
  }
  function pula(campo, valor, telaN){ S[campo] = valor; if(telaN!=null) S.tela = telaN; salva(); render(); }

  function opcoesClasse(n){ return n<=2 ? "opcoes duas" : "opcoes tres"; }

  /* ---------- 1. gancho ---------- */
  function gancho(){
    var p1 = el("p","lead","O Sanji recebeu as entregas no porto: leite, arroz, ovos, pão e uma caixa de tomates. Em dez minutos tudo estava na cozinha do Sunny.");
    var p2 = el("p","lead","O Luffy olhou aquilo e perguntou: “de onde vem isso tudo?”. O Sanji riu: “essa caixa de tomate viajou mais do que você, capitão”.");
    var p3 = el("p","lead","Hoje você vai refazer esse caminho de trás pra frente — do prato até a terra onde o alimento nasceu. É exatamente isso que o teu trabalho de Geografia pede.");
    return card(eyebrow("Missão de hoje"), el("h1",null,"O Caminho até o Prato"), p1, p2, p3, botao("Bora rastrear! →", function(){ vai(1); }));
  }

  /* ---------- 2. a regra ---------- */
  function ficha2(pares){
    var f = el("div","ficha2");
    pares.forEach(function(p){
      f.appendChild(el("b",null,p[0]));
      var s = el("span"); s.innerHTML = p[1];
      f.appendChild(s);
    });
    return f;
  }

  function etapas(itens){
    var w = el("div","etapas");
    itens.forEach(function(it, i){
      var d = el("div","et");
      d.appendChild(el("b",null,String(i+1)));
      var s = el("span"); s.innerHTML = it[0] + "<i>" + it[1] + "</i>";
      d.appendChild(s);
      w.appendChild(d);
    });
    return w;
  }

  function lista(itens){
    var ul = el("ul","passos");
    itens.forEach(function(t){ var li = el("li"); li.innerHTML = t; ul.appendChild(li); });
    return ul;
  }

  function regra(){
    var g = el("div","grupo");

    var r1 = el("div","regra");
    r1.appendChild(el("div","nome","1. O caminho que todo alimento faz"));
    r1.appendChild(etapas([
      ["<b>Produção</b> — no campo","a fazenda planta, colhe ou cria os animais. É de onde sai a <b>matéria-prima</b>"],
      ["<b>Beneficiamento</b> — na indústria","o alimento é limpo, transformado e embalado. Nem todo alimento passa por aqui"],
      ["<b>Circulação</b> — o transporte","caminhão, trem, navio ou avião levam o produto até os pontos de venda"],
      ["<b>Comercialização</b> — a venda","mercado, feira, padaria, loja, aplicativo"],
      ["<b>Consumo</b> — a sua casa","a família compra, cozinha e come"]
    ]));
    g.appendChild(r1);

    var r2 = el("div","regra");
    r2.appendChild(el("div","nome","2. Nem todo alimento faz o mesmo caminho"));
    r2.appendChild(ficha2([
      ["<i>In natura</i>","vai quase direto do campo pra mesa: <b>banana, tomate, alface, ovo</b>. Caminho curto"],
      ["Industrializado","passa pela fábrica antes: <b>trigo → farinha → pão</b>; <b>leite → queijo e iogurte</b>; <b>cana → açúcar</b>. Caminho longo"],
      ["Matéria-prima","é o que ENTRA na fábrica. No pão, a matéria-prima é o <b>trigo</b>; no queijo, o <b>leite</b>; no suco, a <b>fruta</b>"]
    ]));
    r2.appendChild(el("p","muted","Quando a pergunta do trabalho pedir a matéria-prima de um alimento industrializado, pense: o que foi plantado ou criado para fazer isso?"));
    g.appendChild(r2);

    var r3 = el("div","regra");
    r3.appendChild(el("div","nome","3. Quem trabalha nesse caminho"));
    r3.appendChild(el("p","muted","Muito mais gente do que parece: <b>agricultor, pecuarista, ordenhador, tratorista, colhedor, operador de máquina na indústria, embalador, motorista de caminhão, estoquista, repositor, feirante, atendente e entregador</b>. E os meios de transporte: caminhão (rodoviário), trem (ferroviário), navio (hidroviário) e avião (aéreo)."));
    g.appendChild(r3);

    var r4 = el("div","regra");
    r4.appendChild(el("div","nome","4. Duas formas de produzir no campo"));
    r4.appendChild(ficha2([
      ["<b>Agricultura familiar</b>","a <b>própria família</b> é a mão de obra e mora na propriedade. Terrenos <b>menores</b>, <b>variedade grande</b> de produtos, menos máquinas. Boa parte da produção vai para o <b>mercado interno</b> — ou seja, para a mesa dos brasileiros, em feiras, mercados e na merenda escolar"],
      ["<b>Agronegócio</b>","grandes propriedades, <b>trabalhadores contratados</b>, muitas <b>máquinas e tecnologia</b>. Costuma produzir <b>poucos produtos em grande quantidade</b> (monocultura), com boa parte voltada para a <b>exportação</b> e para a indústria"]
    ]));
    r4.appendChild(lista([
      "<b>Números do Censo Agropecuário 2017 (IBGE):</b> a agricultura familiar é <b>77% dos estabelecimentos</b> rurais do país e emprega <b>67% das pessoas</b> que trabalham no campo — mas ocupa só <b>23% da área</b> e responde por <b>23% do valor da produção</b>.",
      "Ela tem papel importante em alimentos do dia a dia: <b>mandioca, feijão, leite, hortaliças, frutas, ovos</b>.",
      "<b>O agronegócio</b> responde por cerca de <b>um quarto do PIB</b> brasileiro (22,8% em 2026, segundo Cepea/CNA) e lidera as exportações: <b>soja, milho, café, carnes, açúcar e algodão</b>.",
      "Os dois são <b>importantes e diferentes</b>: um abastece principalmente a mesa do brasileiro, o outro movimenta a economia e as exportações."
    ]));
    g.appendChild(r4);

    var citacao = el("div","citacao","Pergunta do trabalho: “Todos os alimentos são produzidos da mesma maneira? Explique.”");

    var modelo = el("div","fb"); modelo.setAttribute("data-k","modelo");
    modelo.appendChild(el("b",null,"\u{1F373} Sanji pensa alto: "));
    modelo.appendChild(document.createTextNode(
      "primeiro eu respondo direto, sem enrolar: não, não são. " +
      "Depois eu dou o motivo: alguns vêm quase direto do campo, como o tomate e o ovo; outros passam por fábrica antes de chegar à mesa, como o pão e o iogurte. " +
      "E aí eu dou mais um motivo, o do tipo de propriedade: alguns são produzidos por famílias em propriedades pequenas, outros em grandes fazendas com máquinas. " +
      "Por último eu fecho com um exemplo da minha casa. Pronto: resposta direta, dois motivos e um exemplo — é assim que vale nota cheia."));

    return card(
      navbar("A regra", function(){ vai(0); }),
      eyebrow("A regra"),
      el("h2",null,"Do campo até a sua mesa"),
      g,
      el("p","muted","Vê o Sanji montando uma resposta do trabalho, passo a passo:"),
      citacao, modelo,
      el("p","muted","A fórmula das respostas: RESPONDA DIRETO → DÊ O MOTIVO → DÊ UM EXEMPLO."),
      botao("Entendi, quero treinar →", function(){ vai(2); })
    );
  }

  function montaOpcoes(q, ops, onEscolher){
    q.opcoes.forEach(function(txt,i){
      var b = el("button",null,txt);
      b.addEventListener("click", function(){ if(!b.disabled) onEscolher(i,b); });
      ops.appendChild(b);
    });
  }

  /* ---------- 3. treino guiado ---------- */
  function treino(){
    var idx = S.iG;
    if(idx >= GUIADO.length){
      return card(
        navbar("Treino guiado", function(){ pula("iG", GUIADO.length-1); }),
        eyebrow("Treino guiado"), el("h2",null,"Rastro pego!"),
        el("p",null,"Você já segue o caminho do alimento. Agora é sem dica — e com as pegadinhas do trabalho."),
        botao("Ir pro desafio →", function(){ vai(3); }));
    }
    var q = GUIADO[idx], feito = S.guiado[idx];
    var c = el("div","card");
    c.appendChild(navbar("Treino · " + (idx+1) + " de " + GUIADO.length, function(){
      if(idx > 0) pula("iG", idx-1); else vai(1);
    }));
        if(q.selo){ var sl = el("span","selo", q.selo); if(q.alt) sl.setAttribute("data-m","sci"); var wrap = el("div"); wrap.appendChild(sl); c.appendChild(wrap); }
    if(q.contexto) c.appendChild(el("div","contexto", q.contexto));
    if(q.frase) c.appendChild(frase(q.frase));
    c.appendChild(el("h2",null,q.pergunta));

    var ops = el("div", opcoesClasse(q.opcoes.length));
    var fb = el("div","fb"); fb.style.display="none";
    var tentativa = 0;

    function trava(){ Array.prototype.forEach.call(ops.children,function(x){ x.disabled=true; }); }
    function proxima(){ c.appendChild(botao("Próxima →", function(){ pula("iG", idx+1); window.scrollTo(0,0); })); }
    function diz(k, negrito, resto){
      fb.style.display=""; fb.setAttribute("data-k",k); fb.innerHTML="";
      fb.appendChild(el("b",null,negrito)); fb.appendChild(document.createTextNode(resto));
    }

    montaOpcoes(q, ops, function(i,b){
      if(i === q.certa){
        b.setAttribute("data-state","ok"); trava();
        diz("ok","Isso mesmo! ", q.porque);
        S.guiado[idx] = {feito:true, acertou: tentativa===0}; salva();
        proxima();
      } else {
        tentativa++;
        b.setAttribute("data-state","no");
        if(tentativa === 1){
          diz("dica","Quase. ", q.dica + " Tenta de novo.");
        } else {
          ops.children[q.certa].setAttribute("data-state","ok"); trava();
          diz("no","A certa era: “" + q.opcoes[q.certa] + "”. ", q.porque);
          S.guiado[idx] = {feito:true, acertou:false}; salva();
          proxima();
        }
      }
    });
    c.appendChild(ops); c.appendChild(fb);

    if(feito){
      ops.children[q.certa].setAttribute("data-state","ok"); trava();
      diz(feito.acertou ? "ok" : "no",
          feito.acertou ? "Você acertou de primeira. " : "Aqui você precisou de dica. ",
          q.porque);
      proxima();
    }
    return c;
  }

  /* ---------- 4. desafio ---------- */
  function desafio(){
    var idx = S.iD;
    if(idx >= DESAFIO.length){
      var acertos = 0; for(var k in S.desafio) if(S.desafio[k] && S.desafio[k].acertou) acertos++;
      return card(
        navbar("Desafio", function(){ pula("iD", DESAFIO.length-1); }),
        eyebrow("Desafio"), el("h2",null,"Caminho mapeado! \u{1F69A}"),
        el("p",null,"Você respondeu " + acertos + " de " + DESAFIO.length + " certas de primeira."),
        botao("Última parada →", function(){ vai(4); }));
    }
    var q = DESAFIO[idx], feito = S.desafio[idx];
    var c = el("div","card");
    c.appendChild(navbar("Desafio · " + (idx+1) + " de " + DESAFIO.length, function(){
      if(idx > 0) pula("iD", idx-1); else pula("iG", GUIADO.length, 2);
    }));
        if(q.selo){ var sl = el("span","selo", q.selo); if(q.alt) sl.setAttribute("data-m","sci"); var wrap = el("div"); wrap.appendChild(sl); c.appendChild(wrap); }
    if(q.contexto) c.appendChild(el("div","contexto", q.contexto));
    if(q.frase) c.appendChild(frase(q.frase));
    c.appendChild(el("h2",null,q.pergunta));

    var ops = el("div", opcoesClasse(q.opcoes.length));
    var fb = el("div","fb"); fb.style.display="none";
    function resolve(certo, negrito){
      Array.prototype.forEach.call(ops.children,function(x,i){
        x.disabled = true;
        if(i === q.certa) x.setAttribute("data-state","ok");
      });
      fb.style.display=""; fb.setAttribute("data-k", certo?"ok":"no"); fb.innerHTML="";
      fb.appendChild(el("b",null,negrito));
      fb.appendChild(document.createTextNode(q.nota));
      c.appendChild(botao("Próxima →", function(){ pula("iD", idx+1); window.scrollTo(0,0); }));
    }
    montaOpcoes(q, ops, function(i,b){
      var certo = i === q.certa;
      if(!certo) b.setAttribute("data-state","no");
      S.desafio[idx] = {acertou:certo, marcou:q.opcoes[i]}; salva();
      resolve(certo, certo ? "Certo! " : "Essa não é a melhor resposta. ");
    });
    c.appendChild(ops); c.appendChild(fb);

    if(feito){
      if(!feito.acertou){
        Array.prototype.forEach.call(ops.children,function(x){ if(x.textContent === feito.marcou) x.setAttribute("data-state","no"); });
      }
      resolve(feito.acertou, feito.acertou ? "Você acertou: “" + q.opcoes[q.certa] + "”. " : "Você marcou “" + feito.marcou + "”, mas a melhor resposta era “" + q.opcoes[q.certa] + "”. ");
    }
    return c;
  }

  /* ---------- 5. explique como Droidec ---------- */
  function explicacao(){
    var c2 = el("div","card");
    c2.appendChild(navbar("Explicação", function(){ pula("iD", DESAFIO.length-1, 3); }));
    c2.appendChild(eyebrow("Explique como Droidec"));
    c2.appendChild(el("h2",null,"A pergunta que vale mais ponto"));
    c2.appendChild(el("p","lead","Esta é a questão 3a do teu trabalho: <b>“Quais são as principais diferenças entre a agricultura familiar e o agronegócio?”</b>"));
    c2.appendChild(el("p","lead","Escreve a resposta com as TUAS palavras. Compara os dois em pelo menos <b>três pontos</b>: quem trabalha, o tamanho da produção e para onde vai o que é produzido."));
    var chips = el("div","chips");
    ["quem trabalha","máquinas e tamanho","para onde vai"].forEach(function(t){ chips.appendChild(el("span","chip",t)); });
    c2.appendChild(el("p","muted","Tenta usar estas palavras:"));
    c2.appendChild(chips);
    var ta = el("textarea"); ta.value = S.texto || "";
    ta.setAttribute("placeholder","Na agricultura familiar... Já no agronegócio...");
    var cont = el("div","contador","0 letras");
    var b = botao("Terminei →", function(){ vai(5); });
    b.disabled = true; b.style.opacity = ".45";
    function check(){
      S.texto = ta.value; salva();
      var n = ta.value.trim().length;
      cont.textContent = n + " letras" + (n<40 ? " — escreve mais um pouquinho" : " — pode seguir!");
      b.disabled = n < 40; b.style.opacity = n < 40 ? ".45" : "1";
    }
    ta.addEventListener("input", check);
    c2.appendChild(ta); c2.appendChild(cont); c2.appendChild(b);
    check();
    return c2;
  }

  /* ---------- 6. fim ---------- */
  function fim(){
    var tg=0, ag=0, td=0, ad=0, i;
    for(i=0;i<GUIADO.length;i++){ if(S.guiado[i]){ tg++; if(S.guiado[i].acertou) ag++; } }
    for(i=0;i<DESAFIO.length;i++){ if(S.desafio[i]){ td++; if(S.desafio[i].acertou) ad++; } }
    var total = tg+td, acertos = ag+ad;

    var c = el("div","card");
    c.appendChild(navbar("Fim da rota", function(){ vai(4); }));
    c.appendChild(eyebrow("Fim da rota"));
    c.appendChild(el("h2",null,"Despensa do Sunny, rastreada \u{1F373}"));
    var pl = el("div","placar"); pl.appendChild(document.createTextNode(acertos + "/" + total));
    pl.appendChild(el("small",null,"acertos de primeira"));
    c.appendChild(pl);

    var msg = "Você já sabe rastrear um alimento e comparar as duas formas de produzir — é isso que o trabalho pede.";
    if(ad <= 4) msg = "Agricultura familiar e agronegócio ainda se misturam. Antes de escrever, repete os três pontos: quem trabalha, o tamanho e para onde vai a produção.";
    if(acertos === total) msg = "Você acertou tudo de primeira, inclusive as pegadinhas da matéria-prima e de qual produção abastece a mesa do brasileiro.";
    c.appendChild(el("p",null, msg + " Agora começa o trabalho: primeiro a conversa em casa e a tabela dos 5 alimentos. O resto vem depois, um pedaço por dia."));

    c.appendChild(el("hr","linha"));
    c.appendChild(el("p","muted","Aperta o botão e manda esse resumo pro papai:"));

    var txt = ["TRABALHO DE GEOGRAFIA — De onde vem o que eu consumo (O Caminho até o Prato)",
               "Data: " + new Date().toLocaleDateString("pt-BR"),
               "",
               "Treino guiado: " + ag + "/" + tg + " de primeira",
               "Desafio: " + ad + "/" + td + " de primeira",
               "TOTAL: " + acertos + "/" + total,
               ""];
    var errou = [];
    for(i=0;i<DESAFIO.length;i++) if(S.desafio[i] && !S.desafio[i].acertou) errou.push("Desafio " + (i+1) + ": marcou “" + S.desafio[i].marcou + "”, era “" + DESAFIO[i].opcoes[DESAFIO[i].certa] + "”");
    for(i=0;i<GUIADO.length;i++) if(S.guiado[i] && !S.guiado[i].acertou) errou.push("Treino " + (i+1) + " (precisou de dica)");
    txt.push("Errou / tropeçou:");
    txt.push(errou.length ? "- " + errou.join("\n- ") : "- nada");
    txt.push("", "EXPLICAÇÃO DO ZION (na íntegra):", (S.texto||"").trim() || "(não escreveu)");
    var resumo = txt.join("\n");

    var ta = el("textarea","resumo"); ta.value = resumo; ta.setAttribute("readonly","");
    var b = botao("📋 Copiar resumo pro papai", function(){
      ta.select();
      var ok = false;
      try{ ok = document.execCommand("copy"); }catch(e){}
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(resumo).then(function(){}, function(){}); ok = true; }
      b.textContent = ok ? "✅ Copiado! Manda pro papai" : "Seleciona o texto abaixo e copia";
    });
    c.appendChild(b);
    c.appendChild(ta);

    var reset = el("button","ghost","Começar tudo de novo");
    reset.addEventListener("click", function(){
      S = JSON.parse(JSON.stringify(VAZIO)); salva(); render(); window.scrollTo(0,0);
    });
    c.appendChild(reset);
    return c;
  }

  render();
})();
</script>
