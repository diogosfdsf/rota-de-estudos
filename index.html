<title>Rota de Estudos do Zion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Lexend:wght@300;400;600&display=swap">
<style>
  :root{
    --bg:#EAF1F3; --surface:#FFFFFF; --surface2:#EEF4F6;
    --ink:#16303A; --muted:#57717A; --line:#CBD9DD;
    --accent:#1C7293; --gold:#D97B29; --ok:#2E7D4F; --err:#B23B3B; --on-accent:#FFFFFF;
    --shadow:0 2px 0 rgba(22,48,58,.10), 0 10px 24px -14px rgba(22,48,58,.5);
    --r:16px;
    --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
    --body:"Lexend","Segoe UI",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0A1620; --surface:#11212C; --surface2:#16303A;
      --ink:#E4EEF1; --muted:#86A3AC; --line:#223E48;
      --accent:#4FB8DE; --gold:#F0A050; --ok:#57C98A; --err:#E27272; --on-accent:#06222E;
      --shadow:0 2px 0 rgba(0,0,0,.35), 0 12px 28px -16px rgba(0,0,0,.9);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0A1620; --surface:#11212C; --surface2:#16303A;
    --ink:#E4EEF1; --muted:#86A3AC; --line:#223E48;
    --accent:#4FB8DE; --gold:#F0A050; --ok:#57C98A; --err:#E27272; --on-accent:#06222E;
    --shadow:0 2px 0 rgba(0,0,0,.35), 0 12px 28px -16px rgba(0,0,0,.9);
  }

  body{background:var(--bg); color:var(--ink); font-family:var(--body); font-weight:300;
       line-height:1.6; -webkit-text-size-adjust:100%;}
  .wrap{max-width:660px; margin:0 auto; padding:18px 16px 56px; display:flex; flex-direction:column; gap:18px;}

  header{display:flex; flex-direction:column; gap:10px;}
  .brand{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .brand b{font-family:var(--display); font-weight:800; font-size:1.05rem; letter-spacing:.2px;}
  .brand span{font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted);}
  .rota{display:flex; align-items:center; gap:0; list-style:none; padding:0; margin:0;}
  .rota li{flex:1; display:flex; align-items:center; gap:0;}
  .rota i{display:block; width:13px; height:13px; border-radius:50%; border:2px solid var(--line);
          background:var(--surface); flex:none;}
  .rota li[data-on] i{border-color:var(--accent); background:var(--accent);}
  .rota li[data-now] i{border-color:var(--gold); background:var(--gold); box-shadow:0 0 0 4px color-mix(in srgb, var(--gold) 25%, transparent);}
  .rota li::after{content:""; height:2px; background:var(--line); flex:1; margin:0 2px;}
  .rota li:last-child::after{display:none;}
  .rota li[data-on]::after{background:var(--accent);}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
        box-shadow:var(--shadow); padding:22px 20px; display:flex; flex-direction:column; gap:16px;}
  .eyebrow{font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); font-weight:600;}
  h1{font-family:var(--display); font-weight:800; font-size:1.75rem; line-height:1.15; margin:0; text-wrap:balance;}
  h2{font-family:var(--display); font-weight:800; font-size:1.3rem; line-height:1.2; margin:0; text-wrap:balance;}
  p{margin:0; max-width:60ch;}
  .lead{font-size:1.05rem;}
  .muted{color:var(--muted); font-size:.92rem;}

  button{font-family:inherit; font-size:1rem; cursor:pointer; border-radius:12px; border:1px solid var(--line);
         background:var(--surface2); color:var(--ink); padding:14px 18px; min-height:52px; transition:transform .12s, background .12s, border-color .12s;}
  button:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}
  button:hover:not(:disabled){border-color:var(--accent);}
  button:active:not(:disabled){transform:translateY(1px);}
  button:disabled{cursor:default; opacity:1;}
  .go{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-family:var(--display);
      font-weight:600; font-size:1.1rem; align-self:flex-start; padding:14px 26px;}
  .go:hover{filter:brightness(1.08);}
  .ghost{background:transparent; border-style:dashed; font-size:.9rem; min-height:44px; padding:10px 16px;}

  @media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}

  .opcoes{display:grid; gap:10px;}
  @media (min-width:520px){ .opcoes.tres{grid-template-columns:repeat(3,1fr);} .opcoes.duas{grid-template-columns:repeat(2,1fr);} }
  .opcoes button{font-weight:500; text-align:left; line-height:1.35;}
  .opcoes button[data-state="ok"]{background:color-mix(in srgb, var(--ok) 18%, var(--surface)); border-color:var(--ok); color:var(--ok);}
  .opcoes button[data-state="no"]{background:color-mix(in srgb, var(--err) 14%, var(--surface)); border-color:var(--err); color:var(--err);}

  .fb{border-left:4px solid var(--line); padding:10px 14px; border-radius:0 10px 10px 0; background:var(--surface2); font-size:.95rem;}
  .fb[data-k="ok"]{border-color:var(--ok);}
  .fb[data-k="no"]{border-color:var(--err);}
  .fb[data-k="dica"]{border-color:var(--gold);}
  .fb[data-k="modelo"]{border-color:var(--accent);}
  .fb b{font-family:var(--display);}

  .regra{display:flex; flex-direction:column; gap:6px; padding:14px; border:1px solid var(--line);
         border-radius:12px; background:var(--surface2);}
  .regra .nome{font-family:var(--display); font-weight:800; font-size:1.05rem; color:var(--accent);}
  .grupo{display:flex; flex-direction:column; gap:12px;}

  .citacao{font-style:italic; padding:10px 14px; border-left:3px solid var(--line); color:var(--muted); font-size:1rem;}

  .contexto{background:var(--surface2); border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-size:.95rem;}

  .contador{font-size:.85rem; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; font-weight:600;}
  .nav{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:-4px;}
  .nav .ghost{min-height:42px; padding:8px 16px; color:var(--muted);}
  .nav .ghost:hover{color:var(--accent);}
  .nav .contador{text-align:right;}

  textarea{width:100%; box-sizing:border-box; font-family:var(--body); font-size:1.05rem; line-height:1.6;
           padding:14px; border-radius:12px; border:1px solid var(--line); background:var(--surface2); color:var(--ink);
           min-height:150px; resize:vertical;}
  textarea:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{font-size:.85rem; padding:6px 12px; border-radius:999px; border:1px dashed var(--gold); color:var(--gold);}
  .placar{display:flex; align-items:baseline; gap:10px; font-family:var(--display); font-weight:800; font-size:2.4rem; color:var(--accent);}
  .placar small{font-family:var(--body); font-weight:400; font-size:1rem; color:var(--muted);}
  .resumo{width:100%; box-sizing:border-box; font-family:ui-monospace,"Consolas",monospace; font-size:.8rem; min-height:200px;}
  .linha{height:1px; background:var(--line); border:0; margin:0;}
  footer{text-align:center; font-size:.8rem; color:var(--muted);}

  .grupos{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; padding:4px 0;}
  .grupo-caixa{display:flex; flex-wrap:wrap; gap:4px; max-width:132px; justify-content:center;
               padding:10px 12px; border:2px dashed var(--accent); border-radius:14px;
               background:var(--surface2); font-size:1.55rem; line-height:1.1;}
  .conta{font-family:var(--display); font-weight:800; font-size:1.35rem; color:var(--accent); letter-spacing:.02em;}

  .passos{margin:0; padding-left:1.4em; display:flex; flex-direction:column; gap:4px;}
  .passos li{padding-left:2px;}
  .ruim{color:var(--err); text-decoration:line-through; text-decoration-thickness:1px;}

  .tabterm{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; align-items:baseline;
           padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:var(--surface2);}
  .tabterm b{font-family:var(--display); font-weight:600; color:var(--muted); font-size:.92rem;}
  .tabterm span{font-family:ui-monospace,"Consolas",monospace; font-size:1.02rem; color:var(--ink);}
  .tabterm span em{font-style:normal; color:var(--gold); font-weight:700;}
  .destaque{color:var(--accent); font-weight:600;}

  .silabas{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding:6px 0;}
  .sil{display:flex; flex-direction:column; align-items:center; gap:4px;}
  .sil b{font-family:var(--display); font-weight:600; font-size:1.2rem; padding:10px 16px;
         border-radius:10px; background:var(--surface2); border:1px solid var(--line);}
  .sil small{font-size:.7rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);}
  .sil[data-forte] b{background:var(--gold); border-color:var(--gold); color:var(--on-accent); font-weight:800;}
  .sil[data-forte] small{color:var(--gold); font-weight:700;}

  .tabterm{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; align-items:baseline;
           padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:var(--surface2);}
  .tabterm b{font-family:var(--display); font-weight:600; color:var(--muted); font-size:.92rem;}
  .tabterm span{font-family:ui-monospace,"Consolas",monospace; font-size:1rem; color:var(--ink);}
  .tabterm span em{font-style:normal; color:var(--gold); font-weight:700;}
  .pessoas{display:grid; grid-template-columns:auto auto; gap:4px 16px; justify-content:start;
           padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:var(--surface2);
           font-family:ui-monospace,"Consolas",monospace; font-size:1rem;}
  .pessoas b{font-family:var(--display); color:var(--accent);}

  .ciclo{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px; padding:6px 0;}
  .ciclo span{padding:9px 14px; border-radius:999px; background:var(--surface2); border:1px solid var(--line);
              font-size:.95rem;}
  .ciclo i{font-style:normal; color:var(--gold); font-weight:800;}
  .versus{display:grid; gap:10px;}
  @media (min-width:520px){ .versus{grid-template-columns:1fr 1fr;} }
  .versus > div{padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:var(--surface2);}
  .versus h3{margin:0 0 6px; font-family:var(--display); font-size:1rem; color:var(--accent);}
  .versus ul{margin:0; padding-left:1.1em; font-size:.92rem; color:var(--muted); display:flex; flex-direction:column; gap:3px;}

  .frasev{font-size:1.08rem; padding:10px 14px; border-left:3px solid var(--accent);
          background:var(--surface2); border-radius:0 10px 10px 0; line-height:1.8;}
  .frasev em{font-style:normal; background:var(--gold); color:var(--on-accent);
             padding:2px 7px; border-radius:6px; font-weight:700;}
  .frasev s{color:var(--muted); text-decoration-thickness:1px;}

  .ficha{display:grid; gap:8px;}
  .ficha > div{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; align-items:baseline;
               padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--surface2);}
  .ficha b{font-family:var(--display); font-weight:600; color:var(--accent); font-size:.95rem;}
  .ficha span{font-size:.93rem; color:var(--muted);}

  .verbos{display:flex; flex-direction:column; gap:8px; padding:6px 0;}
  .vb{display:flex; align-items:baseline; gap:2px; flex-wrap:wrap; font-family:var(--display); font-size:1.25rem;}
  .vb .rad{background:var(--accent); color:var(--on-accent); padding:3px 9px; border-radius:8px 0 0 8px; font-weight:800;}
  .vb .ter{background:var(--gold); color:var(--on-accent); padding:3px 9px; border-radius:0 8px 8px 0; font-weight:800;}
  .vb .rad[data-muda]{background:var(--err); color:#fff;}
  .vb small{font-family:var(--body); font-size:.85rem; color:var(--muted); margin-left:8px;}
  .legenda{display:flex; gap:14px; flex-wrap:wrap; font-size:.85rem; color:var(--muted);}
  .legenda i{font-style:normal; display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-1px; margin-right:5px;}

  .figura{display:flex; border:2px solid var(--ink); border-radius:6px; overflow:hidden;
          width:100%; max-width:340px; box-sizing:border-box; margin:4px auto; background:var(--surface);}
  .figura > div{flex:1; height:48px; border-right:1px solid var(--ink);}
  .figura > div:last-child{border-right:0;}
  .figura > div[data-on]{background:var(--gold);}
  .figura.desigual > div{flex:none;}
  .grade{display:grid; gap:0; border:2px solid var(--ink); border-radius:6px; overflow:hidden;
         width:168px; margin:4px auto; background:var(--surface);}
  .grade > div{height:56px; border-right:1px solid var(--ink); border-bottom:1px solid var(--ink);}
  .grade > div[data-on]{background:var(--gold);}
  .fracao{font-family:var(--display); font-weight:800; font-size:1.6rem; text-align:center;
          line-height:1; color:var(--accent); margin:2px 0 6px;}
  .fracao small{display:block; font-size:1.6rem; border-top:3px solid var(--accent); padding-top:2px; margin-top:2px;}
  .legenda-fig{text-align:center; font-size:.85rem; color:var(--muted);}

  .poema{border:1px solid var(--line); border-radius:12px; background:var(--surface2); padding:12px 14px;
         display:flex; flex-direction:column; gap:2px;}
  .poema .v{display:flex; align-items:baseline; justify-content:space-between; gap:14px; padding:5px 0;
            border-bottom:1px dashed var(--line); font-size:1.02rem;}
  .poema .v:last-child{border-bottom:0;}
  .poema .v u{text-decoration:none; font-weight:700; color:var(--accent);}
  .poema .v b{font-family:var(--display); font-weight:800; color:var(--gold); font-size:1.1rem; flex:none;}
  .poema .vazio{color:var(--muted); font-size:.85rem; text-align:center; padding-top:6px;}

  .selo{display:inline-block; font-size:.68rem; letter-spacing:.12em; text-transform:uppercase;
        font-weight:800; padding:4px 10px; border-radius:999px; background:var(--accent);
        color:var(--on-accent); font-family:var(--display); margin-bottom:4px;}
  .selo[data-m="sci"]{background:var(--gold);}
  .ficha2{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; align-items:baseline;
          padding:11px 13px; border:1px solid var(--line); border-radius:11px; background:var(--surface2);}
  .ficha2 b{font-family:var(--display); font-weight:700; color:var(--accent); font-size:.95rem;}
  .ficha2 span{font-size:.93rem;}
  .en{color:var(--gold); font-weight:700;}
</style>

<div class="wrap">
  <header>
    <div class="brand"><b>Droidec</b><span>12/11 · A Travessia da Nami · Geografia — Clima e vegetação do Brasil</span></div>
    <ul class="rota" id="rota"></ul>
  </header>
  <main id="tela"></main>
  <footer>Feito pro Zion 🏴‍☠️</footer>
</div>

<script>
(function(){
  "use strict";

  var GUIADO = [
    {selo:"Tempo × clima", contexto:"O Usopp anotou no diário de bordo: “Hoje choveu a tarde toda em Goiânia.”",
     pergunta:"Ele está falando de tempo ou de clima?",
     opcoes:["Tempo — é como está a atmosfera hoje, num momento","Clima — é o padrão de muitos anos","Os dois significam a mesma coisa"],
     certa:0, dica:"Uma palavra entrega: HOJE. Clima é o que se repete por muitos anos.",
     porque:"Tempo é o estado da atmosfera agora e muda de um dia pro outro. Clima é o padrão que se repete num lugar ao longo de muitos anos."},
    {selo:"Clima", contexto:"Primeira parada da Nami: faz calor o ano inteiro e chove quase todo dia.",
     pergunta:"Que clima é esse, e em que região do Brasil ela está?",
     opcoes:["Equatorial, na região Norte","Semiárido, no Nordeste","Subtropical, no Sul"],
     certa:0, dica:"Quente + úmido + chuva o ano todo. Pensa na maior floresta do país.",
     porque:"É o clima equatorial, típico da região Norte — e é ele que sustenta a Floresta Amazônica."},
    {selo:"Vegetação", alt:true, contexto:"Noutra parada, a Nami vê plantas com espinhos no lugar das folhas, cactos e arbustos que perderam quase todas as folhas.",
     pergunta:"Que vegetação é essa?",
     opcoes:["Caatinga","Floresta Amazônica","Pampa"],
     certa:0, dica:"Espinho e folha pequena servem para uma coisa só: perder menos água.",
     porque:"É a Caatinga, do clima semiárido. As plantas são adaptadas à seca — e esse é o único bioma que existe só no Brasil."},
    {selo:"Clima", contexto:"A Nami reparou que, quanto mais o navio se afastava da linha do Equador em direção ao sul, mais frio ficava.",
     pergunta:"Que fator do clima explica isso?",
     opcoes:["A latitude — a distância até a linha do Equador","A altitude","A proximidade do mar"],
     certa:0, dica:"Latitude tem a ver com estar perto ou longe do Equador. Altitude tem a ver com estar alto ou baixo.",
     porque:"Quanto mais perto do Equador, mais quente; quanto mais longe, mais frio. Isso é a latitude."},
    {selo:"Vegetação", alt:true, contexto:"Calor e chuva o ano todo, com água de sobra para as plantas.",
     pergunta:"Que vegetação combina com o clima equatorial?",
     opcoes:["Floresta Amazônica — densa, com árvores altíssimas","Caatinga","Campos do Pampa"],
     certa:0, nota:null, dica:"Com água de sobra, a planta cresce o quanto quiser. O que aparece?",
     porque:"Água e calor o ano todo permitem uma floresta densa, de árvores altíssimas e muita biodiversidade."}
  ];

  var DESAFIO = [
    {selo:"Vegetação", alt:true, contexto:"Árvores baixas, com troncos retorcidos, casca grossa e raízes muito profundas.",
     pergunta:"Que vegetação é essa, e por que ela é assim?",
     opcoes:["Cerrado — tem estação seca, então as raízes vão fundo atrás de água e a casca grossa protege","Mata Atlântica — porque fica no litoral","Pantanal — porque alaga"],
     certa:0, nota:"O Cerrado é do clima tropical, que tem verão chuvoso e inverno seco. Cada característica da planta é uma defesa contra a seca."},
    {selo:"Clima", contexto:"Chove pouco, de forma irregular, e às vezes passam meses sem chuva. Faz calor o ano todo.",
     pergunta:"Que clima é esse e onde fica?",
     opcoes:["Semiárido, no sertão nordestino","Tropical de altitude, nas serras","Equatorial, no Norte"],
     certa:0, nota:"Semiárido: quente e seco, com chuvas escassas e mal distribuídas. É o clima da Caatinga."},
    {selo:"Clima", contexto:"Quatro estações bem marcadas, inverno frio com geada e chuva distribuída o ano todo.",
     pergunta:"Que clima é esse?",
     opcoes:["Subtropical, na região Sul","Tropical, no Centro-Oeste","Tropical atlântico, no litoral"],
     certa:0, nota:"É o único lugar do Brasil onde as quatro estações aparecem bem separadas. A vegetação típica são os campos do Pampa e as matas de araucária."},
    {selo:"Clima", contexto:"Duas cidades ficam na mesma latitude, mas uma está no alto da serra e a outra perto do nível do mar.",
     pergunta:"O que acontece?",
     opcoes:["A cidade da serra é mais fria — por causa da altitude","As duas têm exatamente a mesma temperatura","A cidade da serra é mais quente"],
     certa:0, nota:"Quanto mais alto, mais frio. É por isso que existe o clima tropical de altitude nas serras do Sudeste."},
    {selo:"Vegetação", alt:true, contexto:"Floresta úmida que ficava em quase toda a faixa litorânea do Brasil — e da qual sobrou uma parte pequena.",
     pergunta:"Que bioma é esse?",
     opcoes:["Mata Atlântica","Floresta Amazônica","Cerrado"],
     certa:0, nota:"A Mata Atlântica foi a mais devastada: é onde começou a ocupação do país e onde vive a maior parte da população."},
    {selo:"Vegetação", alt:true, contexto:"Uma planície que fica alagada durante a cheia e seca depois, no Centro-Oeste.",

     opcoes:["Pantanal","Pampa","Caatinga"],
     certa:0, nota:"O Pantanal vive esse ciclo de cheia e seca todo ano, e por isso mistura plantas de vários biomas vizinhos."},
    {selo:"Tempo × clima", contexto:"Pegadinha!",
     pergunta:"“Neste inverno fez mais frio do que o normal em Curitiba.” Isso é tempo ou clima?",
     opcoes:["Tempo — é o que aconteceu neste inverno específico","Clima — fala de Curitiba","Nenhum dos dois"],
     certa:0, nota:"O clima de Curitiba é subtropical, de inverno frio — isso não muda. Já o que aconteceu NESTE inverno é tempo."},
    {selo:"Clima", contexto:"Outra pegadinha.",
     pergunta:"O Brasil inteiro tem o mesmo clima?",
     opcoes:["Não — o país é enorme e tem vários climas, do equatorial ao subtropical","Sim, tropical em todo lugar","Sim, só muda a temperatura"],
     certa:0, nota:"Por ser um país continental, o Brasil tem climas muito diferentes — e é isso que explica paisagens tão diferentes."},
    {selo:"Vegetação", alt:true, contexto:"Pergunta de causa.",
     pergunta:"Por que a Floresta Amazônica é tão densa?",
     opcoes:["Porque tem calor e chuva o ano todo, ou seja, água de sobra para as plantas","Porque o solo é o mais rico do mundo","Porque ninguém nunca morou lá"],
     certa:0, nota:"É o clima equatorial que sustenta a floresta. Curiosidade: o solo da Amazônia é pobre — quem alimenta a floresta é a própria matéria orgânica que cai das árvores."},
    {selo:"Clima", contexto:"A Nami reparou que, perto do mar, o ar é mais úmido e a temperatura varia menos entre o dia e a noite.",
     pergunta:"Que fator explica isso?",
     opcoes:["A proximidade do mar","A latitude","A altitude"],
     certa:0, nota:"O mar funciona como um regulador: deixa o ar úmido e evita extremos de temperatura. Por isso o litoral tem o clima tropical atlântico."}
  ];

  var KEY = "zion-clima-vegetacao-2026-11-12";
  var VAZIO = {tela:0, iG:0, iD:0, guiado:{}, desafio:{}, texto:""};
  var S = JSON.parse(JSON.stringify(VAZIO));
  try{ var raw = localStorage.getItem(KEY); if(raw){ S = Object.assign(S, JSON.parse(raw)); } }catch(e){}
  function salva(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

  var el = function(t,c,x){ var n=document.createElement(t); if(c) n.className=c; if(x!=null) n.textContent=x; return n; };
  var tela = document.getElementById("tela");
  var TELAS = [gancho, regra, treino, desafio, explicacao, fim];

  function rota(){
    var ul = document.getElementById("rota"); ul.innerHTML="";
    for(var i=0;i<TELAS.length;i++){
      var li = el("li"); li.appendChild(el("i"));
      if(i < S.tela) li.setAttribute("data-on","");
      if(i === S.tela) li.setAttribute("data-now","");
      ul.appendChild(li);
    }
  }
  function vai(n){ S.tela = n; salva(); render(); window.scrollTo(0,0); }
  function render(){ rota(); tela.innerHTML=""; tela.appendChild(TELAS[S.tela]()); }

  function card(){ var c = el("div","card"); for(var i=0;i<arguments.length;i++) c.appendChild(arguments[i]); return c; }
  function eyebrow(t){ return el("div","eyebrow",t); }
  function botao(t,fn){ var b = el("button","go",t); b.addEventListener("click",fn); return b; }

  function navbar(rotulo, voltar){
    var n = el("div","nav");
    if(voltar){
      var b = el("button","ghost","← Voltar");
      b.addEventListener("click", function(){ voltar(); window.scrollTo(0,0); });
      n.appendChild(b);
    } else n.appendChild(el("span"));
    n.appendChild(el("span","contador", rotulo));
    return n;
  }
  function pula(campo, valor, telaN){ S[campo] = valor; if(telaN!=null) S.tela = telaN; salva(); render(); }

  function opcoesClasse(n){ return n<=2 ? "opcoes duas" : "opcoes tres"; }

  /* ---------- 1. gancho ---------- */
  function gancho(){
    var p1 = el("p","lead","A Nami decidiu atravessar o Brasil de norte a sul pra testar o Clima-Tact. Levou casaco, guarda-chuva, protetor solar e cantil cheio.");
    var p2 = el("p","lead","No primeiro dia, na Amazônia, choveu à tarde — como chove quase todo dia. Semanas depois, no sertão, o cantil salvou a viagem: fazia meses que não chovia. E lá no Sul ela precisou do casaco: tinha geada no campo.");
    var p3 = el("p","lead","Mesmo país, paisagens completamente diferentes. Hoje você descobre por quê — e a regra que liga uma coisa à outra.");
    return card(eyebrow("Missão de hoje"), el("h1",null,"A Travessia da Nami"), p1, p2, p3, botao("Bora navegar! →", function(){ vai(1); }));
  }

  /* ---------- 2. a regra ---------- */
  function ficha2(pares){
    var f = el("div","ficha2");
    pares.forEach(function(p){
      f.appendChild(el("b",null,p[0]));
      var s = el("span"); s.innerHTML = p[1];
      f.appendChild(s);
    });
    return f;
  }

  function lista(itens){
    var ul = el("ul","passos");
    itens.forEach(function(t){ var li = el("li"); li.innerHTML = t; ul.appendChild(li); });
    return ul;
  }

  function regra(){
    var g = el("div","grupo");

    var r1 = el("div","regra");
    r1.appendChild(el("div","nome","1. Tempo não é clima"));
    r1.appendChild(ficha2([
      ["Tempo","como está a atmosfera <b>agora</b>, num lugar e num momento. “Hoje choveu à tarde.” Muda de um dia para o outro"],
      ["Clima","o <b>padrão que se repete</b> num lugar ao longo de <b>muitos anos</b>. “Em Manaus chove o ano inteiro.” Demora muito para mudar"]
    ]));
    r1.appendChild(el("p","muted","Jeito fácil de lembrar: o tempo é o humor do dia; o clima é o jeito de ser do lugar."));
    g.appendChild(r1);

    var r2 = el("div","regra");
    r2.appendChild(el("div","nome","2. O que faz o clima mudar de lugar para lugar"));
    r2.appendChild(ficha2([
      ["Latitude","distância até a <b>linha do Equador</b>. Quanto <b>mais perto do Equador, mais quente</b>; quanto mais longe, mais frio"],
      ["Altitude","quanto <b>mais alto</b> o lugar, <b>mais frio</b>. Por isso faz frio nas serras, mesmo em região quente"],
      ["Proximidade do mar","perto do mar o ar fica mais <b>úmido</b> e a temperatura varia menos"],
      ["Vegetação e relevo","florestas deixam o ar mais úmido; montanhas seguram as chuvas de um lado da serra"]
    ]));
    g.appendChild(r2);

    var r3 = el("div","regra");
    r3.appendChild(el("div","nome","3. Os climas do Brasil"));
    r3.appendChild(ficha2([
      ["Equatorial","<b>quente e úmido o ano todo</b>, com chuva quase todo dia. Região <b>Norte</b>"],
      ["Tropical","<b>quente</b>, com duas estações: <b>verão chuvoso e inverno seco</b>. Boa parte do Centro-Oeste, Sudeste e Nordeste"],
      ["Tropical de altitude","nas <b>serras</b> do Sudeste: também tem verão chuvoso, mas as temperaturas são <b>mais amenas</b>"],
      ["Tropical atlântico","na faixa do <b>litoral</b>: quente e <b>úmido</b>, com bastante chuva vinda do mar"],
      ["Semiárido","<b>quente e seco</b>, com pouca chuva e muito irregular. <b>Sertão nordestino</b>"],
      ["Subtropical","Região <b>Sul</b>: as <b>quatro estações</b> bem marcadas, <b>inverno frio</b> com geada, e chuva o ano todo"]
    ]));
    g.appendChild(r3);

    var r4 = el("div","regra");
    r4.appendChild(el("div","nome","4. A regra de ouro: o clima manda na vegetação"));
    r4.appendChild(el("p","muted","A planta não escolhe onde nascer: ela precisa aguentar o clima do lugar. Por isso cada clima tem a sua vegetação."));
    r4.appendChild(ficha2([
      ["Floresta Amazônica","clima <b>equatorial</b>. Calor e chuva o ano todo → floresta <b>densa</b>, árvores <b>altíssimas</b>, enorme <b>biodiversidade</b>"],
      ["Cerrado","clima <b>tropical</b>. Tem estação seca → árvores <b>baixas e retorcidas</b>, <b>casca grossa</b> e <b>raízes muito profundas</b> em busca de água"],
      ["Caatinga","clima <b>semiárido</b>. Pouca chuva → <b>cactos</b>, espinhos, folhas pequenas, e muitas plantas <b>perdem as folhas</b> na seca. É o único bioma <b>só do Brasil</b>"],
      ["Mata Atlântica","clima <b>tropical atlântico</b>, no litoral. Floresta úmida e muito <b>devastada</b>: sobrou uma parte pequena"],
      ["Pampa (Campos)","clima <b>subtropical</b>, no Sul. <b>Gramíneas</b> e campos abertos, usados para criar gado"],
      ["Pantanal","planície do Centro-Oeste que <b>alaga</b> na cheia e seca depois. Mistura plantas de vários biomas vizinhos"]
    ]));
    g.appendChild(r4);

    var citacao = el("div","citacao","Luffy, coçando a cabeça: “Por que no sertão tem cacto e na Amazônia tem árvore gigante? É o mesmo país!”");

    var modelo = el("div","fb"); modelo.setAttribute("data-k","modelo");
    modelo.appendChild(el("b",null,"\u{1F326} Nami pensa alto: "));
    modelo.appendChild(document.createTextNode(
      "primeiro eu olho o clima de cada lugar, porque é ele que manda. Na Amazônia chove quase todo dia e faz calor: tem água de sobra. " +
      "Com água de sobra, a planta pode crescer o quanto quiser — por isso floresta densa e árvore gigante. " +
      "No sertão o clima é semiárido: chove pouco e de forma irregular. Uma árvore gigante morreria de sede ali. " +
      "Então sobrevivem as plantas que sabem guardar água: cacto, espinho no lugar de folha, folha pequena pra perder menos água. " +
      "Conclusão: não é o país que muda, é o clima. E a vegetação só segue o clima."));

    return card(
      navbar("A regra", function(){ vai(0); }),
      eyebrow("A regra"),
      el("h2",null,"Por que o Brasil tem tantas paisagens"),
      g,
      el("p","muted","Vê a Nami ligando as duas coisas, passo a passo:"),
      citacao, modelo,
      el("p","muted","A pergunta que resolve quase tudo: QUANTA CHUVA TEM AQUI? → é isso que define a planta."),
      botao("Entendi, quero treinar →", function(){ vai(2); })
    );
  }

  function montaOpcoes(q, ops, onEscolher){
    q.opcoes.forEach(function(txt,i){
      var b = el("button",null,txt);
      b.addEventListener("click", function(){ if(!b.disabled) onEscolher(i,b); });
      ops.appendChild(b);
    });
  }

  /* ---------- 3. treino guiado ---------- */
  function treino(){
    var idx = S.iG;
    if(idx >= GUIADO.length){
      return card(
        navbar("Treino guiado", function(){ pula("iG", GUIADO.length-1); }),
        eyebrow("Treino guiado"), el("h2",null,"Rota aberta!"),
        el("p",null,"Você já liga clima e vegetação. Agora é sem dica — e com as pegadinhas da travessia."),
        botao("Ir pro desafio →", function(){ vai(3); }));
    }
    var q = GUIADO[idx], feito = S.guiado[idx];
    var c = el("div","card");
    c.appendChild(navbar("Treino · " + (idx+1) + " de " + GUIADO.length, function(){
      if(idx > 0) pula("iG", idx-1); else vai(1);
    }));
        if(q.selo){ var sl = el("span","selo", q.selo); if(q.alt) sl.setAttribute("data-m","sci"); var wrap = el("div"); wrap.appendChild(sl); c.appendChild(wrap); }
    if(q.contexto) c.appendChild(el("div","contexto", q.contexto));
    if(q.frase) c.appendChild(frase(q.frase));
    c.appendChild(el("h2",null,q.pergunta));

    var ops = el("div", opcoesClasse(q.opcoes.length));
    var fb = el("div","fb"); fb.style.display="none";
    var tentativa = 0;

    function trava(){ Array.prototype.forEach.call(ops.children,function(x){ x.disabled=true; }); }
    function proxima(){ c.appendChild(botao("Próxima →", function(){ pula("iG", idx+1); window.scrollTo(0,0); })); }
    function diz(k, negrito, resto){
      fb.style.display=""; fb.setAttribute("data-k",k); fb.innerHTML="";
      fb.appendChild(el("b",null,negrito)); fb.appendChild(document.createTextNode(resto));
    }

    montaOpcoes(q, ops, function(i,b){
      if(i === q.certa){
        b.setAttribute("data-state","ok"); trava();
        diz("ok","Isso mesmo! ", q.porque);
        S.guiado[idx] = {feito:true, acertou: tentativa===0}; salva();
        proxima();
      } else {
        tentativa++;
        b.setAttribute("data-state","no");
        if(tentativa === 1){
          diz("dica","Quase. ", q.dica + " Tenta de novo.");
        } else {
          ops.children[q.certa].setAttribute("data-state","ok"); trava();
          diz("no","A certa era: “" + q.opcoes[q.certa] + "”. ", q.porque);
          S.guiado[idx] = {feito:true, acertou:false}; salva();
          proxima();
        }
      }
    });
    c.appendChild(ops); c.appendChild(fb);

    if(feito){
      ops.children[q.certa].setAttribute("data-state","ok"); trava();
      diz(feito.acertou ? "ok" : "no",
          feito.acertou ? "Você acertou de primeira. " : "Aqui você precisou de dica. ",
          q.porque);
      proxima();
    }
    return c;
  }

  /* ---------- 4. desafio ---------- */
  function desafio(){
    var idx = S.iD;
    if(idx >= DESAFIO.length){
      var acertos = 0; for(var k in S.desafio) if(S.desafio[k] && S.desafio[k].acertou) acertos++;
      return card(
        navbar("Desafio", function(){ pula("iD", DESAFIO.length-1); }),
        eyebrow("Desafio"), el("h2",null,"Travessia completa! \u{1F30D}"),
        el("p",null,"Você respondeu " + acertos + " de " + DESAFIO.length + " certas de primeira."),
        botao("Última parada →", function(){ vai(4); }));
    }
    var q = DESAFIO[idx], feito = S.desafio[idx];
    var c = el("div","card");
    c.appendChild(navbar("Desafio · " + (idx+1) + " de " + DESAFIO.length, function(){
      if(idx > 0) pula("iD", idx-1); else pula("iG", GUIADO.length, 2);
    }));
        if(q.selo){ var sl = el("span","selo", q.selo); if(q.alt) sl.setAttribute("data-m","sci"); var wrap = el("div"); wrap.appendChild(sl); c.appendChild(wrap); }
    if(q.contexto) c.appendChild(el("div","contexto", q.contexto));
    if(q.frase) c.appendChild(frase(q.frase));
    c.appendChild(el("h2",null,q.pergunta));

    var ops = el("div", opcoesClasse(q.opcoes.length));
    var fb = el("div","fb"); fb.style.display="none";
    function resolve(certo, negrito){
      Array.prototype.forEach.call(ops.children,function(x,i){
        x.disabled = true;
        if(i === q.certa) x.setAttribute("data-state","ok");
      });
      fb.style.display=""; fb.setAttribute("data-k", certo?"ok":"no"); fb.innerHTML="";
      fb.appendChild(el("b",null,negrito));
      fb.appendChild(document.createTextNode(q.nota));
      c.appendChild(botao("Próxima →", function(){ pula("iD", idx+1); window.scrollTo(0,0); }));
    }
    montaOpcoes(q, ops, function(i,b){
      var certo = i === q.certa;
      if(!certo) b.setAttribute("data-state","no");
      S.desafio[idx] = {acertou:certo, marcou:q.opcoes[i]}; salva();
      resolve(certo, certo ? "Certo! " : "Essa não é a melhor resposta. ");
    });
    c.appendChild(ops); c.appendChild(fb);

    if(feito){
      if(!feito.acertou){
        Array.prototype.forEach.call(ops.children,function(x){ if(x.textContent === feito.marcou) x.setAttribute("data-state","no"); });
      }
      resolve(feito.acertou, feito.acertou ? "Você acertou: “" + q.opcoes[q.certa] + "”. " : "Você marcou “" + feito.marcou + "”, mas a melhor resposta era “" + q.opcoes[q.certa] + "”. ");
    }
    return c;
  }

  /* ---------- 5. explique como Droidec ---------- */
  function explicacao(){
    var c2 = el("div","card");
    c2.appendChild(navbar("Explicação", function(){ pula("iD", DESAFIO.length-1, 3); }));
    c2.appendChild(eyebrow("Explique como Droidec"));
    c2.appendChild(el("h2",null,"Como você explicaria isso pro Luffy?"));
    c2.appendChild(el("p","lead","O Luffy continua sem entender: “é o mesmo país, por que no sertão tem cacto e na Amazônia tem árvore gigante?”."));
    c2.appendChild(el("p","lead","Explica pra ele, com as TUAS palavras, <b>como o clima de um lugar decide a vegetação</b>. Fala dos dois lugares: o que acontece onde chove muito e o que acontece onde chove pouco."));
    var chips = el("div","chips");
    ["clima","chuva","adaptada / guarda água"].forEach(function(t){ chips.appendChild(el("span","chip",t)); });
    c2.appendChild(el("p","muted","Tenta usar estas palavras:"));
    c2.appendChild(chips);
    var ta = el("textarea"); ta.value = S.texto || "";
    ta.setAttribute("placeholder","Luffy, quem manda na vegetação é...");
    var cont = el("div","contador","0 letras");
    var b = botao("Terminei →", function(){ vai(5); });
    b.disabled = true; b.style.opacity = ".45";
    function check(){
      S.texto = ta.value; salva();
      var n = ta.value.trim().length;
      cont.textContent = n + " letras" + (n<40 ? " — escreve mais um pouquinho" : " — pode seguir!");
      b.disabled = n < 40; b.style.opacity = n < 40 ? ".45" : "1";
    }
    ta.addEventListener("input", check);
    c2.appendChild(ta); c2.appendChild(cont); c2.appendChild(b);
    check();
    return c2;
  }

  /* ---------- 6. fim ---------- */
  function fim(){
    var tg=0, ag=0, td=0, ad=0, i;
    for(i=0;i<GUIADO.length;i++){ if(S.guiado[i]){ tg++; if(S.guiado[i].acertou) ag++; } }
    for(i=0;i<DESAFIO.length;i++){ if(S.desafio[i]){ td++; if(S.desafio[i].acertou) ad++; } }
    var total = tg+td, acertos = ag+ad;

    var c = el("div","card");
    c.appendChild(navbar("Fim da rota", function(){ vai(4); }));
    c.appendChild(eyebrow("Fim da rota"));
    c.appendChild(el("h2",null,"Clima-Tact calibrado \u{1F326}"));
    var pl = el("div","placar"); pl.appendChild(document.createTextNode(acertos + "/" + total));
    pl.appendChild(el("small",null,"acertos de primeira"));
    c.appendChild(pl);

    var msg = "Você já explica a paisagem pelo clima — é isso que a professora quer ver nas respostas.";
    if(ad <= 4) msg = "Os nomes dos climas ainda se misturam. Antes da folha, repete a regra: quanta chuva tem aqui? É isso que define a planta.";
    if(acertos === total) msg = "Você acertou tudo de primeira, inclusive as pegadinhas de tempo × clima e da altitude.";
    c.appendChild(el("p",null, msg + " Agora faz a folha: em cada questão, pergunta primeiro qual é o clima — a vegetação vem atrás."));

    c.appendChild(el("hr","linha"));
    c.appendChild(el("p","muted","Aperta o botão e manda esse resumo pro papai:"));

    var txt = ["AULA DE HOJE — Geografia: Clima e vegetação do Brasil (A Travessia da Nami)",
               "Data: " + new Date().toLocaleDateString("pt-BR"),
               "",
               "Treino guiado: " + ag + "/" + tg + " de primeira",
               "Desafio: " + ad + "/" + td + " de primeira",
               "TOTAL: " + acertos + "/" + total,
               ""];
    var errou = [];
    for(i=0;i<DESAFIO.length;i++) if(S.desafio[i] && !S.desafio[i].acertou) errou.push("Desafio " + (i+1) + ": marcou “" + S.desafio[i].marcou + "”, era “" + DESAFIO[i].opcoes[DESAFIO[i].certa] + "”");
    for(i=0;i<GUIADO.length;i++) if(S.guiado[i] && !S.guiado[i].acertou) errou.push("Treino " + (i+1) + " (precisou de dica)");
    txt.push("Errou / tropeçou:");
    txt.push(errou.length ? "- " + errou.join("\n- ") : "- nada");
    txt.push("", "EXPLICAÇÃO DO ZION (na íntegra):", (S.texto||"").trim() || "(não escreveu)");
    var resumo = txt.join("\n");

    var ta = el("textarea","resumo"); ta.value = resumo; ta.setAttribute("readonly","");
    var b = botao("📋 Copiar resumo pro papai", function(){
      ta.select();
      var ok = false;
      try{ ok = document.execCommand("copy"); }catch(e){}
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(resumo).then(function(){}, function(){}); ok = true; }
      b.textContent = ok ? "✅ Copiado! Manda pro papai" : "Seleciona o texto abaixo e copia";
    });
    c.appendChild(b);
    c.appendChild(ta);

    var reset = el("button","ghost","Começar tudo de novo");
    reset.addEventListener("click", function(){
      S = JSON.parse(JSON.stringify(VAZIO)); salva(); render(); window.scrollTo(0,0);
    });
    c.appendChild(reset);
    return c;
  }

  render();
})();
</script>
