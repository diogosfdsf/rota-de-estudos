<title>Rota de Estudos do Zion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Lexend:wght@300;400;600&display=swap">
<style>
  :root{
    --bg:#F3EBDD; --surface:#FFFBF3; --surface2:#F6EEDF;
    --ink:#2E2216; --muted:#77634C; --line:#DDCDB3;
    --accent:#7A4FA3; --gold:#C9792A; --ok:#2E7D4F; --err:#B23B3B; --on-accent:#FFFFFF;
    --shadow:0 2px 0 rgba(46,34,22,.10), 0 10px 24px -14px rgba(46,34,22,.5);
    --r:16px;
    --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
    --body:"Lexend","Segoe UI",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0E1222; --surface:#161B30; --surface2:#1D2440;
      --ink:#E8E6F2; --muted:#9C9AB8; --line:#2A3253;
      --accent:#B591E0; --gold:#F0A050; --ok:#57C98A; --err:#E27272; --on-accent:#14102A;
      --shadow:0 2px 0 rgba(0,0,0,.35), 0 12px 28px -16px rgba(0,0,0,.9);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1222; --surface:#161B30; --surface2:#1D2440;
    --ink:#E8E6F2; --muted:#9C9AB8; --line:#2A3253;
    --accent:#B591E0; --gold:#F0A050; --ok:#57C98A; --err:#E27272; --on-accent:#14102A;
    --shadow:0 2px 0 rgba(0,0,0,.35), 0 12px 28px -16px rgba(0,0,0,.9);
  }

  body{background:var(--bg); color:var(--ink); font-family:var(--body); font-weight:300;
       line-height:1.6; -webkit-text-size-adjust:100%;}
  .wrap{max-width:660px; margin:0 auto; padding:18px 16px 56px; display:flex; flex-direction:column; gap:18px;}

  header{display:flex; flex-direction:column; gap:10px;}
  .brand{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .brand b{font-family:var(--display); font-weight:800; font-size:1.05rem; letter-spacing:.2px;}
  .brand span{font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted);}
  .rota{display:flex; align-items:center; gap:0; list-style:none; padding:0; margin:0;}
  .rota li{flex:1; display:flex; align-items:center; gap:0;}
  .rota i{display:block; width:13px; height:13px; border-radius:50%; border:2px solid var(--line);
          background:var(--surface); flex:none;}
  .rota li[data-on] i{border-color:var(--accent); background:var(--accent);}
  .rota li[data-now] i{border-color:var(--gold); background:var(--gold); box-shadow:0 0 0 4px color-mix(in srgb, var(--gold) 25%, transparent);}
  .rota li::after{content:""; height:2px; background:var(--line); flex:1; margin:0 2px;}
  .rota li:last-child::after{display:none;}
  .rota li[data-on]::after{background:var(--accent);}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
        box-shadow:var(--shadow); padding:22px 20px; display:flex; flex-direction:column; gap:16px;}
  .eyebrow{font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); font-weight:600;}
  h1{font-family:var(--display); font-weight:800; font-size:1.75rem; line-height:1.15; margin:0; text-wrap:balance;}
  h2{font-family:var(--display); font-weight:800; font-size:1.3rem; line-height:1.2; margin:0; text-wrap:balance;}
  p{margin:0; max-width:60ch;}
  .lead{font-size:1.05rem;}
  .muted{color:var(--muted); font-size:.92rem;}

  button{font-family:inherit; font-size:1rem; cursor:pointer; border-radius:12px; border:1px solid var(--line);
         background:var(--surface2); color:var(--ink); padding:14px 18px; min-height:52px; transition:transform .12s, background .12s, border-color .12s;}
  button:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}
  button:hover:not(:disabled){border-color:var(--accent);}
  button:active:not(:disabled){transform:translateY(1px);}
  button:disabled{cursor:default; opacity:1;}
  .go{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-family:var(--display);
      font-weight:600; font-size:1.1rem; align-self:flex-start; padding:14px 26px;}
  .go:hover{filter:brightness(1.08);}
  .ghost{background:transparent; border-style:dashed; font-size:.9rem; min-height:44px; padding:10px 16px;}

  @media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}

  .opcoes{display:grid; gap:10px;}
  @media (min-width:520px){ .opcoes.tres{grid-template-columns:repeat(3,1fr);} .opcoes.duas{grid-template-columns:repeat(2,1fr);} }
  .opcoes button{font-weight:500; text-align:left; line-height:1.35;}
  .opcoes button[data-state="ok"]{background:color-mix(in srgb, var(--ok) 18%, var(--surface)); border-color:var(--ok); color:var(--ok);}
  .opcoes button[data-state="no"]{background:color-mix(in srgb, var(--err) 14%, var(--surface)); border-color:var(--err); color:var(--err);}

  .fb{border-left:4px solid var(--line); padding:10px 14px; border-radius:0 10px 10px 0; background:var(--surface2); font-size:.95rem;}
  .fb[data-k="ok"]{border-color:var(--ok);}
  .fb[data-k="no"]{border-color:var(--err);}
  .fb[data-k="dica"]{border-color:var(--gold);}
  .fb[data-k="modelo"]{border-color:var(--accent);}
  .fb b{font-family:var(--display);}

  .regra{display:flex; flex-direction:column; gap:8px; padding:14px; border:1px solid var(--line);
         border-radius:12px; background:var(--surface2);}
  .regra .nome{font-family:var(--display); font-weight:800; font-size:1.05rem; color:var(--accent);}
  .regra .macete{font-size:.92rem; padding:6px 10px; border-radius:8px; border:1px dashed var(--gold); color:var(--ink);}
  .regra .macete b{color:var(--gold); font-family:var(--display);}
  .grupo{display:flex; flex-direction:column; gap:12px;}

  .citacao{font-style:italic; padding:10px 14px; border-left:3px solid var(--line); color:var(--muted); font-size:1rem;}
  .contexto{background:var(--surface2); border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-size:1.02rem;}

  .contador{font-size:.85rem; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; font-weight:600;}
  .nav{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:-4px;}
  .nav .ghost{min-height:42px; padding:8px 16px; color:var(--muted);}
  .nav .ghost:hover{color:var(--accent);}
  .nav .contador{text-align:right;}

  textarea{width:100%; box-sizing:border-box; font-family:var(--body); font-size:1.05rem; line-height:1.6;
           padding:14px; border-radius:12px; border:1px solid var(--line); background:var(--surface2); color:var(--ink);
           min-height:150px; resize:vertical;}
  textarea:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{font-size:.85rem; padding:6px 12px; border-radius:999px; border:1px dashed var(--gold); color:var(--gold);}
  .placar{display:flex; align-items:baseline; gap:10px; font-family:var(--display); font-weight:800; font-size:2.4rem; color:var(--accent);}
  .placar small{font-family:var(--body); font-weight:400; font-size:1rem; color:var(--muted);}
  .resumo{width:100%; box-sizing:border-box; font-family:ui-monospace,"Consolas",monospace; font-size:.8rem; min-height:200px;}
  .linha{height:1px; background:var(--line); border:0; margin:0;}
  footer{text-align:center; font-size:.8rem; color:var(--muted);}

  .silabas{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding:6px 0;}
  .sil{display:flex; flex-direction:column; align-items:center; gap:4px;}
  .sil b{font-family:var(--display); font-weight:600; font-size:1.2rem; padding:10px 14px;
         border-radius:10px; background:var(--surface); border:1px solid var(--line);}
  .sil small{font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);}
  .sil[data-forte] b{background:var(--gold); border-color:var(--gold); color:var(--on-accent); font-weight:800;}
  .sil[data-forte] small{color:var(--gold); font-weight:700;}

  .tabv{width:100%; border-collapse:collapse; font-size:.92rem;}
  .tabv th, .tabv td{padding:6px 8px; border-bottom:1px solid var(--line); text-align:left;}
  .tabv th{font-family:var(--display); color:var(--muted); font-weight:600;}
  .tabv td em{font-style:normal; color:var(--gold); font-weight:700;}
  .tabv-wrap{overflow-x:auto;}
</style>

<div class="wrap">
  <header>
    <div class="brand"><b>Droidec</b><span>23/10 · A Canção do Brook · Português — Revisão para a prova</span></div>
    <ul class="rota" id="rota"></ul>
  </header>
  <main id="tela"></main>
  <footer>Feito pro Zion 🏴‍☠️</footer>
</div>

<script>
(function(){
  "use strict";

  var GUIADO = [
    {contexto:"O Brook escreveu uma canção em linhas curtas sobre o mar. Quem ouve sente saudade e alegria ao mesmo tempo.",
     pergunta:"Essa saudade e alegria que a canção passa é…",
     opcoes:["a poesia","o poema","o poeta"],
     certa:0, dica:"Poema é o texto, poeta é a pessoa. E o SENTIMENTO, como se chama?",
     porque:"Poesia é a emoção, a arte. O texto escrito é o poema e o Brook, que criou, é o poeta."},
    {contexto:"No caderno do Brook tem um bloco com 3 linhas, separado dos outros por um espaço em branco.",
     pergunta:"Como se chama uma estrofe de 3 versos?",
     opcoes:["terceto","dístico","quarteto"],
     certa:0, dica:"Dístico tem 2 (di = dois), quarteto tem 4. E 3?",
     porque:"Terceto = 3 versos (lembra de TRÊS). Dístico = 2, quarteto ou quadrinha = 4."},
    {contexto:"“A Robin queria ler ___ um capítulo, ___ a lamparina apagou.”",
     pergunta:"Qual palavra vai na SEGUNDA lacuna?",
     opcoes:["mas","mais"],
     certa:0, dica:"Faz o teste da troca: dá pra colocar PORÉM ali? Ou MENOS?",
     porque:"“…porém a lamparina apagou” faz sentido, então é MAS (ideia contrária). Na primeira lacuna vai MAIS: “ler menos um capítulo” também cabe."},
    {contexto:"Fala a palavra CANETA como se estivesse chamando alguém lá do outro lado do Sunny: ca… NE… ta!",
     pergunta:"A sílaba forte é NE, a penúltima. Então caneta é…",
     opcoes:["paroxítona","oxítona","proparoxítona"],
     certa:0, dica:"Conta de trás pra frente: ta é a última, NE é a…?",
     porque:"ca-NE-ta: a forte é a penúltima, então é paroxítona. Repara que ela não tem acento — o som é que manda."},
    {contexto:"“Amanhã o Sanji ______ um bolo de laranja.” (preparar)",
     pergunta:"Qual forma combina com “amanhã”?",
     opcoes:["preparará","preparou","prepara"],
     certa:0, dica:"Amanhã é passado, presente ou futuro?",
     porque:"Amanhã é pista de FUTURO: preparar + -á = preparará. Preparou é passado (ontem) e prepara é presente (hoje)."}
  ];

  var DESAFIO = [
    {contexto:"“O vento cantava nas velas do Sunny.”",
     pergunta:"Que palavra mágica do poema aparece aqui?",
     opcoes:["Personificação","Metáfora","Nenhuma, é sentido real"],
     certa:0, nota:"O vento não canta de verdade — ele ganhou uma ação de gente. Dar vida a coisas que não estão vivas é personificação."},
    {contexto:"“O Luffy é o sol da tripulação.”",
     pergunta:"Que palavra mágica do poema aparece aqui?",
     opcoes:["Metáfora","Personificação","Nenhuma, é sentido real"],
     certa:0, nota:"O Luffy não é uma estrela. O poeta junta duas coisas diferentes (Luffy e sol) sem usar “como”, pra dizer que ele ilumina e alegra todo mundo. É metáfora, a comparação escondida."},
    {contexto:"“O Zoro treinou a manhã inteira, ___ se perdeu no caminho de volta.”",
     pergunta:"Mas ou mais?",
     opcoes:["mas","mais"],
     certa:0, nota:"“…porém se perdeu” funciona: é uma coisa contra o que se esperava. Então é MAS, sem I."},
    {contexto:"“A Nami é a navegadora ___ esperta dos mares.”",
     pergunta:"Mas ou mais?",
     opcoes:["mais","mas"],
     certa:0, nota:"“A navegadora menos esperta” encaixa (mesmo que não seja verdade!). Troca por MENOS → é MAIS, com I."},
    {contexto:"Pegadinha da palavra comprida: REFRIGERANTE. Fala chamando de longe: re-fri-ge-RAN-te.",
     pergunta:"Como ela se classifica?",
     opcoes:["paroxítona","proparoxítona","oxítona"],
     certa:0, nota:"Comprida não quer dizer proparoxítona! A forte é RAN, a penúltima → paroxítona. E proparoxítona SEMPRE tem acento — refrigerante não tem."},
    {contexto:"TAMBOR (o do Usopp). Fala chamando: tam… BOR!",
     pergunta:"Como ela se classifica?",
     opcoes:["oxítona","paroxítona","proparoxítona"],
     certa:0, nota:"tam-BOR: a forte é a última sílaba → oxítona. Mesmo sem acento! Nem toda oxítona tem acento."},
    {contexto:"“Ontem a Nami desenhou um mapa novo.”",
     pergunta:"Qual é o verbo e em que tempo ele está?",
     opcoes:["desenhou — pretérito (passado)","desenhou — presente","mapa — pretérito"],
     certa:0, nota:"Verbo é a palavra da AÇÃO: desenhou. “Ontem” e a terminação -ou mostram pretérito (passado). Mapa é uma coisa, não ação."},
    {contexto:"“A festa começa quando o Franky ______ para o convés.” (verbo vir)",
     pergunta:"Qual forma completa a frase?",
     opcoes:["vier","vir","veio"],
     certa:0, nota:"Depois de “quando”, falando de algo que ainda vai acontecer, o verbo vir fica VIER: quando ele vier, se ele vier. É irregular, por isso parece estranho. Veio é passado."},
    {contexto:"Um poema tem 3 blocos separados por espaço em branco. Cada bloco tem 4 linhas.",
     pergunta:"Quantas estrofes e quantos versos?",
     opcoes:["3 estrofes e 12 versos","12 estrofes e 3 versos","3 estrofes e 4 versos"],
     certa:0, nota:"Cada bloco é uma estrofe (3) e cada linha é um verso: 4 + 4 + 4 = 12. Na prova, conta os versos de TODAS as estrofes e soma."}
  ];

  // a certa vem sempre primeiro nos dados; gira as opções para ela variar de posição
  [GUIADO, DESAFIO].forEach(function(lista, j){
    lista.forEach(function(q, i){
      var n = q.opcoes.length, r = (i*2 + j + 1) % n;
      q.opcoes = q.opcoes.slice(r).concat(q.opcoes.slice(0, r));
      q.certa = (q.certa - r + n) % n;
    });
  });

  var KEY = "zion-revisao-portugues-2026-10-23";
  var VAZIO = {tela:0, iG:0, iD:0, guiado:{}, desafio:{}, texto:""};
  var S = JSON.parse(JSON.stringify(VAZIO));
  try{ var raw = localStorage.getItem(KEY); if(raw){ S = Object.assign(S, JSON.parse(raw)); } }catch(e){}
  function salva(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

  var el = function(t,c,x){ var n=document.createElement(t); if(c) n.className=c; if(x!=null) n.textContent=x; return n; };
  var tela = document.getElementById("tela");
  var TELAS = [gancho, regra, treino, desafio, explicacao, fim];

  function rota(){
    var ul = document.getElementById("rota"); ul.innerHTML="";
    for(var i=0;i<TELAS.length;i++){
      var li = el("li"); li.appendChild(el("i"));
      if(i < S.tela) li.setAttribute("data-on","");
      if(i === S.tela) li.setAttribute("data-now","");
      ul.appendChild(li);
    }
  }
  function vai(n){ S.tela = n; salva(); render(); window.scrollTo(0,0); }
  function render(){ rota(); tela.innerHTML=""; tela.appendChild(TELAS[S.tela]()); }

  function card(){ var c = el("div","card"); for(var i=0;i<arguments.length;i++) c.appendChild(arguments[i]); return c; }
  function eyebrow(t){ return el("div","eyebrow",t); }
  function botao(t,fn){ var b = el("button","go",t); b.addEventListener("click",fn); return b; }

  function navbar(rotulo, voltar){
    var n = el("div","nav");
    if(voltar){
      var b = el("button","ghost","← Voltar");
      b.addEventListener("click", function(){ voltar(); window.scrollTo(0,0); });
      n.appendChild(b);
    } else n.appendChild(el("span"));
    n.appendChild(el("span","contador", rotulo));
    return n;
  }
  function pula(campo, valor, telaN){ S[campo] = valor; if(telaN!=null) S.tela = telaN; salva(); render(); }

  function opcoesClasse(n){ return n<=2 ? "opcoes duas" : "opcoes tres"; }

  /* ---------- 1. gancho ---------- */
  function gancho(){
    var p1 = el("p","lead","O Brook escreveu uma canção nova pro show de hoje à noite no Sunny. Mas uma onda molhou o caderno dele e borrou um monte de coisas.");
    var p2 = el("p","lead","Sumiram uns MAS e uns MAIS, os verbos ficaram sem tempo, e ninguém lembra qual sílaba cantar mais forte. Sem isso, a música desafina.");
    var p3 = el("p","lead","Você vai arrumar o caderno — e de quebra revisar tudo o que cai na prova de Português. Yohohoho! Bora?");
    return card(eyebrow("Missão de hoje"), el("h1",null,"A Canção do Brook"), p1, p2, p3, botao("Bora afinar! →", function(){ vai(1); }));
  }

  /* ---------- 2. a regra ---------- */
  function silabas(partes, forte, rotulos){
    var w = el("div","silabas");
    partes.forEach(function(s,i){
      var d = el("div","sil");
      if(i === forte) d.setAttribute("data-forte","");
      d.appendChild(el("b",null,s));
      d.appendChild(el("small",null,rotulos[i]));
      w.appendChild(d);
    });
    return w;
  }

  function bloco(nome, texto, macete){
    var r = el("div","regra");
    r.appendChild(el("div","nome",nome));
    var p = el("p","muted"); p.innerHTML = texto; r.appendChild(p);
    if(macete){ var m = el("div","macete"); m.innerHTML = "<b>Macete: </b>" + macete; r.appendChild(m); }
    return r;
  }

  function regra(){
    var g = el("div","grupo");

    g.appendChild(bloco("1. Poema, poesia e poeta",
      "<b>Poema</b> é o texto, em linhas curtas. <b>Poesia</b> é a emoção, a arte — pode estar até num pôr do sol. <b>Poeta</b> é quem cria. Cada linha é um <b>verso</b>; cada bloco de versos é uma <b>estrofe</b>: dístico (2), terceto (3), quarteto ou quadrinha (4). <b>Rima</b> é o som igual no fim (canção / coração). <b>Ritmo</b> é a música da leitura, com sílabas fortes e fracas.",
      "o poeta cria um poema para mostrar a sua poesia."));

    g.appendChild(bloco("2. As palavras mágicas",
      "<b>Metáfora</b>: junta duas coisas diferentes sem usar “como” — “o mar é um tapete azul”. <b>Personificação</b>: uma coisa sem vida faz coisa de gente — “a lua sorriu pra mim”.",
      "tem coisa agindo como pessoa? Personificação. Uma coisa “É” outra? Metáfora."));

    g.appendChild(bloco("3. MAS ou MAIS",
      "<b>MAIS</b> (com I) é quantidade, o contrário de menos. <b>MAS</b> (sem I) é ideia contrária, igual a porém.",
      "troca por MENOS → é MAIS. Troca por PORÉM → é MAS."));

    var r4 = bloco("4. A sílaba forte",
      "Conta de trás pra frente. A forte é a <b>última</b>: oxítona. A <b>penúltima</b>: paroxítona. A <b>antepenúltima</b>: proparoxítona — e essa sempre tem acento.",
      "fala a palavra CHAMANDO alguém de longe. A sílaba que estica é a forte. Nunca chuta pelo tamanho!");
    g.appendChild(r4);

    var r5 = el("div","regra");
    r5.appendChild(el("div","nome","5. O tempo do verbo"));
    r5.appendChild(el("p","muted","O verbo é a ação. A terminação mostra QUANDO ela acontece:"));
    var tw = el("div","tabv-wrap");
    var t = el("table","tabv");
    t.innerHTML = "<tr><th></th><th>falar</th><th>comer</th><th>partir</th></tr>" +
      "<tr><td>Ontem (pretérito)</td><td>eu fal<em>ei</em>, ele fal<em>ou</em>, eles fal<em>aram</em></td><td>com<em>i</em>, com<em>eu</em>, com<em>eram</em></td><td>part<em>i</em>, part<em>iu</em>, part<em>iram</em></td></tr>" +
      "<tr><td>Hoje (presente)</td><td>fal<em>o</em>, fal<em>a</em>, fal<em>am</em></td><td>com<em>o</em>, com<em>e</em>, com<em>em</em></td><td>part<em>o</em>, part<em>e</em>, part<em>em</em></td></tr>" +
      "<tr><td>Amanhã (futuro)</td><td>fal<em>arei</em>, fal<em>ará</em>, fal<em>arão</em></td><td>com<em>erei</em>, com<em>erá</em>, com<em>erão</em></td><td>part<em>irei</em>, part<em>irá</em>, part<em>irão</em></td></tr>";
    tw.appendChild(t); r5.appendChild(tw);
    var m5 = el("div","macete"); m5.innerHTML = "<b>Macete: </b>procura a palavra-pista. Ontem → passado. Hoje/agora → presente. Amanhã/no próximo → futuro.";
    r5.appendChild(m5);
    g.appendChild(r5);

    var citacao = el("div","citacao","O Usopp aponta pro caderno: “Brook, COMPUTADOR é proparoxítona, né? É enorme!”");
    var sil = silabas(["com","pu","ta","dor"], 3, ["", "antepenúlt.","penúltima","última"]);
    var modelo = el("div","fb"); modelo.setAttribute("data-k","modelo");
    modelo.appendChild(el("b",null,"\u{1F3BB} Brook pensa alto: "));
    modelo.appendChild(document.createTextNode(
      "tamanho não conta, Usopp. Primeiro eu separo: com-pu-ta-dor, quatro sílabas. " +
      "Depois eu falo chamando de longe: “computaDOOOR!”. A voz esticou no DOR. " +
      "Agora conto de trás pra frente: DOR é a última. Última forte é oxítona. " +
      "E confiro: se fosse proparoxítona, teria acento obrigatório — e computador não tem. Yohohoho!"));

    return card(
      navbar("As regras", function(){ vai(0); }),
      eyebrow("O que cai na prova"),
      el("h2",null,"As 5 páginas do caderno do Brook"),
      g,
      el("p","muted","Vê o Brook descobrindo a sílaba forte, passo a passo:"),
      citacao, sil, modelo,
      el("p","muted","Ordem certa: SEPARA → FALA CHAMANDO → CONTA DE TRÁS PRA FRENTE."),
      botao("Entendi, quero treinar →", function(){ vai(2); })
    );
  }

  function montaOpcoes(q, ops, onEscolher){
    q.opcoes.forEach(function(txt,i){
      var b = el("button",null,txt);
      b.addEventListener("click", function(){ if(!b.disabled) onEscolher(i,b); });
      ops.appendChild(b);
    });
  }

  /* ---------- 3. treino guiado ---------- */
  function treino(){
    var idx = S.iG;
    if(idx >= GUIADO.length){
      return card(
        navbar("Treino guiado", function(){ pula("iG", GUIADO.length-1); }),
        eyebrow("Treino guiado"), el("h2",null,"Caderno quase seco!"),
        el("p",null,"Você passou pelas cinco páginas com ajuda. Agora é sem dica, e com as pegadinhas que costumam cair na prova."),
        botao("Ir pro desafio →", function(){ vai(3); }));
    }
    var q = GUIADO[idx], feito = S.guiado[idx];
    var c = el("div","card");
    c.appendChild(navbar("Treino · " + (idx+1) + " de " + GUIADO.length, function(){
      if(idx > 0) pula("iG", idx-1); else vai(1);
    }));
    if(q.contexto) c.appendChild(el("div","contexto", q.contexto));
    c.appendChild(el("h2",null,q.pergunta));

    var ops = el("div", opcoesClasse(q.opcoes.length));
    var fb = el("div","fb"); fb.style.display="none";
    var tentativa = 0;

    function trava(){ Array.prototype.forEach.call(ops.children,function(x){ x.disabled=true; }); }
    function proxima(){ c.appendChild(botao("Próxima →", function(){ pula("iG", idx+1); window.scrollTo(0,0); })); }
    function diz(k, negrito, resto){
      fb.style.display=""; fb.setAttribute("data-k",k); fb.innerHTML="";
      fb.appendChild(el("b",null,negrito)); fb.appendChild(document.createTextNode(resto));
    }

    montaOpcoes(q, ops, function(i,b){
      if(i === q.certa){
        b.setAttribute("data-state","ok"); trava();
        diz("ok","Isso mesmo! ", q.porque);
        S.guiado[idx] = {feito:true, acertou: tentativa===0}; salva();
        proxima();
      } else {
        tentativa++;
        b.setAttribute("data-state","no");
        if(tentativa === 1){
          diz("dica","Quase. ", q.dica + " Tenta de novo.");
        } else {
          ops.children[q.certa].setAttribute("data-state","ok"); trava();
          diz("no","A certa era: “" + q.opcoes[q.certa] + "”. ", q.porque);
          S.guiado[idx] = {feito:true, acertou:false}; salva();
          proxima();
        }
      }
    });
    c.appendChild(ops); c.appendChild(fb);

    if(feito){
      ops.children[q.certa].setAttribute("data-state","ok"); trava();
      diz(feito.acertou ? "ok" : "no",
          feito.acertou ? "Você acertou de primeira. " : "Aqui você precisou de dica. ",
          q.porque);
      proxima();
    }
    return c;
  }

  /* ---------- 4. desafio ---------- */
  function desafio(){
    var idx = S.iD;
    if(idx >= DESAFIO.length){
      var acertos = 0; for(var k in S.desafio) if(S.desafio[k] && S.desafio[k].acertou) acertos++;
      return card(
        navbar("Desafio", function(){ pula("iD", DESAFIO.length-1); }),
        eyebrow("Desafio"), el("h2",null,"Canção afinada! \u{1F3B5}"),
        el("p",null,"Você respondeu " + acertos + " de " + DESAFIO.length + " certas de primeira."),
        botao("Última parada →", function(){ vai(4); }));
    }
    var q = DESAFIO[idx], feito = S.desafio[idx];
    var c = el("div","card");
    c.appendChild(navbar("Desafio · " + (idx+1) + " de " + DESAFIO.length, function(){
      if(idx > 0) pula("iD", idx-1); else pula("iG", GUIADO.length, 2);
    }));
    if(q.contexto) c.appendChild(el("div","contexto", q.contexto));
    c.appendChild(el("h2",null,q.pergunta));

    var ops = el("div", opcoesClasse(q.opcoes.length));
    var fb = el("div","fb"); fb.style.display="none";
    function resolve(certo, negrito){
      Array.prototype.forEach.call(ops.children,function(x,i){
        x.disabled = true;
        if(i === q.certa) x.setAttribute("data-state","ok");
      });
      fb.style.display=""; fb.setAttribute("data-k", certo?"ok":"no"); fb.innerHTML="";
      fb.appendChild(el("b",null,negrito));
      fb.appendChild(document.createTextNode(q.nota));
      c.appendChild(botao("Próxima →", function(){ pula("iD", idx+1); window.scrollTo(0,0); }));
    }
    montaOpcoes(q, ops, function(i,b){
      var certo = i === q.certa;
      if(!certo) b.setAttribute("data-state","no");
      S.desafio[idx] = {acertou:certo, marcou:q.opcoes[i]}; salva();
      resolve(certo, certo ? "Certo! " : "Essa não é a melhor resposta. ");
    });
    c.appendChild(ops); c.appendChild(fb);

    if(feito){
      if(!feito.acertou){
        Array.prototype.forEach.call(ops.children,function(x){ if(x.textContent === feito.marcou) x.setAttribute("data-state","no"); });
      }
      resolve(feito.acertou, feito.acertou ? "Você acertou: “" + q.opcoes[q.certa] + "”. " : "Você marcou “" + feito.marcou + "”, mas a melhor resposta era “" + q.opcoes[q.certa] + "”. ");
    }
    return c;
  }

  /* ---------- 5. explique como Droidec ---------- */
  function explicacao(){
    var c2 = el("div","card");
    c2.appendChild(navbar("Explicação", function(){ pula("iD", DESAFIO.length-1, 3); }));
    c2.appendChild(eyebrow("Explique como Droidec"));
    c2.appendChild(el("h2",null,"Como você explicaria isso pro Chopper?"));
    c2.appendChild(el("p","lead","O Chopper disse: “CAMARADA é proparoxítona, porque é uma palavra grandona!”"));
    c2.appendChild(el("p","lead","Explica pra ele, com as TUAS palavras, como descobrir de verdade a sílaba forte — o que fazer primeiro, depois e no fim — e qual é a resposta certa."));
    var chips = el("div","chips");
    ["separar as sílabas","chamar de longe","contar de trás pra frente"].forEach(function(t){ chips.appendChild(el("span","chip",t)); });
    c2.appendChild(el("p","muted","Tenta usar estas palavras:"));
    c2.appendChild(chips);
    var ta = el("textarea"); ta.value = S.texto || "";
    ta.setAttribute("placeholder","Chopper, primeiro você...");
    var cont = el("div","contador","0 letras");
    var b = botao("Terminei →", function(){ vai(5); });
    b.disabled = true; b.style.opacity = ".45";
    function check(){
      S.texto = ta.value; salva();
      var n = ta.value.trim().length;
      cont.textContent = n + " letras" + (n<40 ? " — escreve mais um pouquinho" : " — pode seguir!");
      b.disabled = n < 40; b.style.opacity = n < 40 ? ".45" : "1";
    }
    ta.addEventListener("input", check);
    c2.appendChild(ta); c2.appendChild(cont); c2.appendChild(b);
    check();
    return c2;
  }

  /* ---------- 6. fim ---------- */
  function fim(){
    var tg=0, ag=0, td=0, ad=0, i;
    for(i=0;i<GUIADO.length;i++){ if(S.guiado[i]){ tg++; if(S.guiado[i].acertou) ag++; } }
    for(i=0;i<DESAFIO.length;i++){ if(S.desafio[i]){ td++; if(S.desafio[i].acertou) ad++; } }
    var total = tg+td, acertos = ag+ad;

    var c = el("div","card");
    c.appendChild(navbar("Fim da rota", function(){ vai(4); }));
    c.appendChild(eyebrow("Fim da rota"));
    c.appendChild(el("h2",null,"O show pode começar \u{1F3BB}"));
    var pl = el("div","placar"); pl.appendChild(document.createTextNode(acertos + "/" + total));
    pl.appendChild(el("small",null,"acertos de primeira"));
    c.appendChild(pl);

    var tonicaOk = S.desafio[4] && S.desafio[4].acertou && S.desafio[5] && S.desafio[5].acertou;
    var msg = tonicaOk
      ? "Você classificou palavras SEM acento pelo som, inclusive a comprida que engana — era a parte mais difícil."
      : "A sílaba forte ainda escorrega quando a palavra não tem acento. Antes da prova, fala cinco palavras chamando de longe e conta de trás pra frente.";
    if(acertos === total) msg = "Você acertou tudo de primeira, inclusive as pegadinhas de mas/mais, da palavra comprida e do verbo vier.";
    c.appendChild(el("p",null, msg + " Agora pega a folha de revisão da escola e faz os exercícios sozinho."));

    c.appendChild(el("hr","linha"));
    c.appendChild(el("p","muted","Aperta o botão e manda esse resumo pro papai:"));

    var txt = ["AULA DE HOJE — Português: Revisão para a prova (A Canção do Brook)",
               "Data: " + new Date().toLocaleDateString("pt-BR"),
               "",
               "Treino guiado: " + ag + "/" + tg + " de primeira",
               "Desafio: " + ad + "/" + td + " de primeira",
               "TOTAL: " + acertos + "/" + total,
               ""];
    var errou = [];
    for(i=0;i<DESAFIO.length;i++) if(S.desafio[i] && !S.desafio[i].acertou) errou.push("Desafio " + (i+1) + " (" + DESAFIO[i].contexto + "): marcou “" + S.desafio[i].marcou + "”, era “" + DESAFIO[i].opcoes[DESAFIO[i].certa] + "”");
    for(i=0;i<GUIADO.length;i++) if(S.guiado[i] && !S.guiado[i].acertou) errou.push("Treino " + (i+1) + " (precisou de dica)");
    txt.push("Errou / tropeçou:");
    txt.push(errou.length ? "- " + errou.join("\n- ") : "- nada");
    txt.push("", "EXPLICAÇÃO DO ZION (na íntegra):", (S.texto||"").trim() || "(não escreveu)");
    var resumo = txt.join("\n");

    var ta = el("textarea","resumo"); ta.value = resumo; ta.setAttribute("readonly","");
    var b = botao("📋 Copiar resumo pro papai", function(){
      ta.select();
      var ok = false;
      try{ ok = document.execCommand("copy"); }catch(e){}
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(resumo).then(function(){}, function(){}); ok = true; }
      b.textContent = ok ? "✅ Copiado! Manda pro papai" : "Seleciona o texto abaixo e copia";
    });
    c.appendChild(b);
    c.appendChild(ta);

    var reset = el("button","ghost","Começar tudo de novo");
    reset.addEventListener("click", function(){
      S = JSON.parse(JSON.stringify(VAZIO)); salva(); render(); window.scrollTo(0,0);
    });
    c.appendChild(reset);
    return c;
  }

  render();
})();
</script>
