<title>Rota de Estudos do Zion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Lexend:wght@300;400;600&display=swap">
<style>
  :root{
    --bg:#EAF1F3; --surface:#FFFFFF; --surface2:#EEF4F6;
    --ink:#16303A; --muted:#57717A; --line:#CBD9DD;
    --accent:#1C7293; --gold:#D97B29; --ok:#2E7D4F; --err:#B23B3B; --on-accent:#FFFFFF;
    --shadow:0 2px 0 rgba(22,48,58,.10), 0 10px 24px -14px rgba(22,48,58,.5);
    --r:16px;
    --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
    --body:"Lexend","Segoe UI",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0A1620; --surface:#11212C; --surface2:#16303A;
      --ink:#E4EEF1; --muted:#86A3AC; --line:#223E48;
      --accent:#4FB8DE; --gold:#F0A050; --ok:#57C98A; --err:#E27272; --on-accent:#06222E;
      --shadow:0 2px 0 rgba(0,0,0,.35), 0 12px 28px -16px rgba(0,0,0,.9);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0A1620; --surface:#11212C; --surface2:#16303A;
    --ink:#E4EEF1; --muted:#86A3AC; --line:#223E48;
    --accent:#4FB8DE; --gold:#F0A050; --ok:#57C98A; --err:#E27272; --on-accent:#06222E;
    --shadow:0 2px 0 rgba(0,0,0,.35), 0 12px 28px -16px rgba(0,0,0,.9);
  }

  body{background:var(--bg); color:var(--ink); font-family:var(--body); font-weight:300;
       line-height:1.6; -webkit-text-size-adjust:100%;}
  .wrap{max-width:660px; margin:0 auto; padding:18px 16px 56px; display:flex; flex-direction:column; gap:18px;}

  header{display:flex; flex-direction:column; gap:10px;}
  .brand{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .brand b{font-family:var(--display); font-weight:800; font-size:1.05rem; letter-spacing:.2px;}
  .brand span{font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted);}
  .rota{display:flex; align-items:center; gap:0; list-style:none; padding:0; margin:0;}
  .rota li{flex:1; display:flex; align-items:center; gap:0;}
  .rota i{display:block; width:13px; height:13px; border-radius:50%; border:2px solid var(--line);
          background:var(--surface); flex:none;}
  .rota li[data-on] i{border-color:var(--accent); background:var(--accent);}
  .rota li[data-now] i{border-color:var(--gold); background:var(--gold); box-shadow:0 0 0 4px color-mix(in srgb, var(--gold) 25%, transparent);}
  .rota li::after{content:""; height:2px; background:var(--line); flex:1; margin:0 2px;}
  .rota li:last-child::after{display:none;}
  .rota li[data-on]::after{background:var(--accent);}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
        box-shadow:var(--shadow); padding:22px 20px; display:flex; flex-direction:column; gap:16px;}
  .eyebrow{font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); font-weight:600;}
  h1{font-family:var(--display); font-weight:800; font-size:1.75rem; line-height:1.15; margin:0; text-wrap:balance;}
  h2{font-family:var(--display); font-weight:800; font-size:1.3rem; line-height:1.2; margin:0; text-wrap:balance;}
  p{margin:0; max-width:60ch;}
  .lead{font-size:1.05rem;}
  .muted{color:var(--muted); font-size:.92rem;}

  button{font-family:inherit; font-size:1rem; cursor:pointer; border-radius:12px; border:1px solid var(--line);
         background:var(--surface2); color:var(--ink); padding:14px 18px; min-height:52px; transition:transform .12s, background .12s, border-color .12s;}
  button:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}
  button:hover:not(:disabled){border-color:var(--accent);}
  button:active:not(:disabled){transform:translateY(1px);}
  button:disabled{cursor:default; opacity:1;}
  .go{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-family:var(--display);
      font-weight:600; font-size:1.1rem; align-self:flex-start; padding:14px 26px;}
  .go:hover{filter:brightness(1.08);}
  .ghost{background:transparent; border-style:dashed; font-size:.9rem; min-height:44px; padding:10px 16px;}

  @media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}

  .opcoes{display:grid; gap:10px;}
  @media (min-width:520px){ .opcoes.tres{grid-template-columns:repeat(3,1fr);} .opcoes.duas{grid-template-columns:repeat(2,1fr);} }
  .opcoes button{font-weight:500; text-align:left; line-height:1.35;}
  .opcoes button[data-state="ok"]{background:color-mix(in srgb, var(--ok) 18%, var(--surface)); border-color:var(--ok); color:var(--ok);}
  .opcoes button[data-state="no"]{background:color-mix(in srgb, var(--err) 14%, var(--surface)); border-color:var(--err); color:var(--err);}

  .fb{border-left:4px solid var(--line); padding:10px 14px; border-radius:0 10px 10px 0; background:var(--surface2); font-size:.95rem;}
  .fb[data-k="ok"]{border-color:var(--ok);}
  .fb[data-k="no"]{border-color:var(--err);}
  .fb[data-k="dica"]{border-color:var(--gold);}
  .fb[data-k="modelo"]{border-color:var(--accent);}
  .fb b{font-family:var(--display);}

  .regra{display:flex; flex-direction:column; gap:6px; padding:14px; border:1px solid var(--line);
         border-radius:12px; background:var(--surface2);}
  .regra .nome{font-family:var(--display); font-weight:800; font-size:1.05rem; color:var(--accent);}
  .grupo{display:flex; flex-direction:column; gap:12px;}

  .citacao{font-style:italic; padding:10px 14px; border-left:3px solid var(--line); color:var(--muted); font-size:1rem;}

  .contexto{background:var(--surface2); border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-size:.95rem;}

  .contador{font-size:.85rem; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; font-weight:600;}
  .nav{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:-4px;}
  .nav .ghost{min-height:42px; padding:8px 16px; color:var(--muted);}
  .nav .ghost:hover{color:var(--accent);}
  .nav .contador{text-align:right;}

  textarea{width:100%; box-sizing:border-box; font-family:var(--body); font-size:1.05rem; line-height:1.6;
           padding:14px; border-radius:12px; border:1px solid var(--line); background:var(--surface2); color:var(--ink);
           min-height:150px; resize:vertical;}
  textarea:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{font-size:.85rem; padding:6px 12px; border-radius:999px; border:1px dashed var(--gold); color:var(--gold);}
  .placar{display:flex; align-items:baseline; gap:10px; font-family:var(--display); font-weight:800; font-size:2.4rem; color:var(--accent);}
  .placar small{font-family:var(--body); font-weight:400; font-size:1rem; color:var(--muted);}
  .resumo{width:100%; box-sizing:border-box; font-family:ui-monospace,"Consolas",monospace; font-size:.8rem; min-height:200px;}
  .linha{height:1px; background:var(--line); border:0; margin:0;}
  footer{text-align:center; font-size:.8rem; color:var(--muted);}

  .grupos{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; padding:4px 0;}
  .grupo-caixa{display:flex; flex-wrap:wrap; gap:4px; max-width:132px; justify-content:center;
               padding:10px 12px; border:2px dashed var(--accent); border-radius:14px;
               background:var(--surface2); font-size:1.55rem; line-height:1.1;}
  .conta{font-family:var(--display); font-weight:800; font-size:1.35rem; color:var(--accent); letter-spacing:.02em;}

  .passos{margin:0; padding-left:1.4em; display:flex; flex-direction:column; gap:4px;}
  .passos li{padding-left:2px;}
  .ruim{color:var(--err); text-decoration:line-through; text-decoration-thickness:1px;}

  .tabterm{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; align-items:baseline;
           padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:var(--surface2);}
  .tabterm b{font-family:var(--display); font-weight:600; color:var(--muted); font-size:.92rem;}
  .tabterm span{font-family:ui-monospace,"Consolas",monospace; font-size:1.02rem; color:var(--ink);}
  .tabterm span em{font-style:normal; color:var(--gold); font-weight:700;}
  .destaque{color:var(--accent); font-weight:600;}

  .silabas{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding:6px 0;}
  .sil{display:flex; flex-direction:column; align-items:center; gap:4px;}
  .sil b{font-family:var(--display); font-weight:600; font-size:1.2rem; padding:10px 16px;
         border-radius:10px; background:var(--surface2); border:1px solid var(--line);}
  .sil small{font-size:.7rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);}
  .sil[data-forte] b{background:var(--gold); border-color:var(--gold); color:var(--on-accent); font-weight:800;}
  .sil[data-forte] small{color:var(--gold); font-weight:700;}
</style>

<div class="wrap">
  <header>
    <div class="brand"><b>Droidec</b><span>21/09 · O Tambor do Brook · Português — Sílaba tônica</span></div>
    <ul class="rota" id="rota"></ul>
  </header>
  <main id="tela"></main>
  <footer>Feito pro Zion 🏴‍☠️</footer>
</div>

<script>
(function(){
  "use strict";

  var GUIADO = [
    {contexto:"Bate palma junto: te / sou / ra.", silabas:["te","sou","ra"], forte:null,
     pergunta:"Falando “Ô, tesouraaa!”, em qual sílaba a tua voz sobe?",
     opcoes:["sou","te","ra"],
     certa:0, dica:"Fala em voz alta, chamando alguém de longe. A sílaba que sai mais forte é a tônica.",
     porque:"te-SOU-ra. A voz sobe no SOU: essa é a sílaba tônica."},
    {contexto:"A batida de CADERNO cai assim:", silabas:["ca","DER","no"], forte:1, rotulos:["antepenúltima","penúltima","última"],
     pergunta:"A batida caiu na penúltima sílaba. Como essa palavra se chama?",
     opcoes:["Paroxítona","Oxítona","Proparoxítona"],
     certa:0, dica:"Conta de trás pra frente: última = oxítona, penúltima = paroxítona, antepenúltima = proparoxítona.",
     porque:"Batida na penúltima = paroxítona. A maioria das palavras do português é assim."},
    {contexto:"Agora SÁBADO:", silabas:["SÁ","ba","do"], forte:0, rotulos:["antepenúltima","penúltima","última"],
     pergunta:"Como se classifica?",
     opcoes:["Proparoxítona","Paroxítona","Oxítona"],
     certa:0, dica:"A batida caiu na terceira contando do fim pro começo. Qual é o nome dessa?",
     porque:"SÁ-ba-do: batida na antepenúltima = proparoxítona. E repara: ela tem acento, como TODA proparoxítona."},
    {contexto:"Cuidado com esta:", silabas:["com","pu","ta","DOR"], forte:3, rotulos:[null,null,"penúltima","última"],
     pergunta:"Computador tem 4 sílabas. Como se classifica?",
     opcoes:["Oxítona","Proparoxítona","Paroxítona"],
     certa:0, dica:"Esquece o tamanho da palavra. Onde caiu a batida: com-pu-ta-DOR?",
     porque:"A batida caiu na ÚLTIMA sílaba, então é oxítona — mesmo sendo uma palavra comprida. Tamanho não classifica nada."},
    {contexto:"Uma regra que vale sempre.",
     pergunta:"Toda palavra proparoxítona leva acento?",
     opcoes:["Sim, todas — sem exceção","Não, só algumas","Só quando termina em A"],
     certa:0, dica:"Pensa em música, médico, sábado, ônibus, relâmpago. Alguma delas está sem acento?",
     porque:"Todas as proparoxítonas são acentuadas: música, médico, sábado, ônibus, relâmpago, plástico. Essa regra não tem exceção."}
  ];

  var DESAFIO = [
    {contexto:null, silabas:["mú","si","ca"], forte:null,
     pergunta:"Classifique: MÚSICA",
     opcoes:["Proparoxítona","Paroxítona","Oxítona"],
     certa:0, nota:"MÚ-si-ca: batida na antepenúltima. O próprio acento já mostra onde a voz sobe."},
    {contexto:null, silabas:["ban","dei","ra"], forte:null,
     pergunta:"Classifique: BANDEIRA",
     opcoes:["Paroxítona","Proparoxítona","Oxítona"],
     certa:0, nota:"ban-DEI-ra: a batida cai na penúltima, então é paroxítona. Ter três sílabas não faz dela proparoxítona."},
    {contexto:null, silabas:["fei","jão"], forte:null,
     pergunta:"Classifique: FEIJÃO",
     opcoes:["Oxítona","Paroxítona","Proparoxítona"],
     certa:0, nota:"fei-JÃO: a voz sobe na última sílaba. Oxítona."},
    {contexto:"Pegadinha das grandes.", silabas:["re","fri","ge","ran","te"], forte:null,
     pergunta:"Classifique: REFRIGERANTE",
     opcoes:["Paroxítona","Proparoxítona","Oxítona"],
     certa:0, nota:"Cinco sílabas, e mesmo assim re-fri-ge-RAN-te tem a batida na penúltima: paroxítona. Palavra comprida engana, a batida não."},
    {contexto:null, silabas:["ô","ni","bus"], forte:null,
     pergunta:"Classifique: ÔNIBUS",
     opcoes:["Proparoxítona","Paroxítona","Oxítona"],
     certa:0, nota:"Ô-ni-bus: batida na antepenúltima. Proparoxítona, e por isso vem acentuada."},
    {contexto:"Uma destas palavras está escrita SEM o acento que precisa.",
     pergunta:"Qual delas?",
     opcoes:["sabado","caderno","pastel"],
     certa:0, nota:"“Sábado” é proparoxítona, e toda proparoxítona leva acento. Caderno e pastel não precisam."},
    {contexto:"A palavra JACARE está sem acento.",
     pergunta:"Ela precisa de acento?",
     opcoes:["Sim: jacaré — é oxítona terminada em E","Não, nenhuma oxítona leva acento","Só se tivesse 4 sílabas"],
     certa:0, nota:"Oxítona terminada em A, E ou O (e em EM) leva acento: jacaré, sofá, cipó, também. Já “pastel” e “animal” não levam."},
    {contexto:"Três classificações de um colega.",
     pergunta:"Qual está ERRADA?",
     opcoes:["pastel → proparoxítona","médico → proparoxítona","gravata → paroxítona"],
     certa:0, nota:"pas-TEL é oxítona: a batida cai na última. Proparoxítona precisa de pelo menos três sílabas E batida na antepenúltima."}
  ];

  var KEY = "zion-silaba-tonica-2026-09-21";
  var VAZIO = {tela:0, iG:0, iD:0, guiado:{}, desafio:{}, texto:""};
  var S = JSON.parse(JSON.stringify(VAZIO));
  try{ var raw = localStorage.getItem(KEY); if(raw){ S = Object.assign(S, JSON.parse(raw)); } }catch(e){}
  function salva(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

  var el = function(t,c,x){ var n=document.createElement(t); if(c) n.className=c; if(x!=null) n.textContent=x; return n; };
  var tela = document.getElementById("tela");
  var TELAS = [gancho, regra, treino, desafio, explicacao, fim];

  function rota(){
    var ul = document.getElementById("rota"); ul.innerHTML="";
    for(var i=0;i<TELAS.length;i++){
      var li = el("li"); li.appendChild(el("i"));
      if(i < S.tela) li.setAttribute("data-on","");
      if(i === S.tela) li.setAttribute("data-now","");
      ul.appendChild(li);
    }
  }
  function vai(n){ S.tela = n; salva(); render(); window.scrollTo(0,0); }
  function render(){ rota(); tela.innerHTML=""; tela.appendChild(TELAS[S.tela]()); }

  function card(){ var c = el("div","card"); for(var i=0;i<arguments.length;i++) c.appendChild(arguments[i]); return c; }
  function eyebrow(t){ return el("div","eyebrow",t); }
  function botao(t,fn){ var b = el("button","go",t); b.addEventListener("click",fn); return b; }

  function navbar(rotulo, voltar){
    var n = el("div","nav");
    if(voltar){
      var b = el("button","ghost","← Voltar");
      b.addEventListener("click", function(){ voltar(); window.scrollTo(0,0); });
      n.appendChild(b);
    } else n.appendChild(el("span"));
    n.appendChild(el("span","contador", rotulo));
    return n;
  }
  function pula(campo, valor, telaN){ S[campo] = valor; if(telaN!=null) S.tela = telaN; salva(); render(); }

  function opcoesClasse(n){ return n<=2 ? "opcoes duas" : "opcoes tres"; }

  /* ---------- 1. gancho ---------- */
  function gancho(){
    var p1 = el("p","lead","O Brook descobriu uma coisa: toda palavra tem ritmo. Quando você fala, uma sílaba sempre sai mais FORTE que as outras — é a batida do tambor dentro da palavra.");
    var p2 = el("p","lead","Ele quer transformar as palavras em música, mas só consegue se souber onde cai a batida forte de cada uma. E tem palavra que engana: é grande, mas a batida está lá no meio.");
    var p3 = el("p","lead","Hoje você é o baterista do Brook. Missão: achar a sílaba forte de qualquer palavra — mesmo das que não têm acento nenhum. Yohohoho!");
    return card(eyebrow("Missão de hoje"), el("h1",null,"O Tambor do Brook"), p1, p2, p3, botao("Bora tocar! →", function(){ vai(1); }));
  }

  /* ---------- 2. a regra ---------- */
  function silabas(lista, forte, rotulos){
    var w = el("div","silabas");
    lista.forEach(function(s, i){
      var d = el("div","sil");
      if(i === forte) d.setAttribute("data-forte","");
      d.appendChild(el("b",null,s));
      if(rotulos && rotulos[i]) d.appendChild(el("small",null,rotulos[i]));
      w.appendChild(d);
    });
    return w;
  }

  function regra(){
    var g = el("div","grupo");

    var r1 = el("div","regra");
    r1.appendChild(el("div","nome","1. Ache a batida forte"));
    r1.appendChild(el("p","muted","Fale a palavra como se estivesse CHAMANDO alguém de longe, batendo palma em cada sílaba. A sílaba em que a sua voz sobe é a tônica. Não precisa de acento escrito pra ela existir."));
    g.appendChild(r1);

    var r2 = el("div","regra");
    r2.appendChild(el("div","nome","2. Conte de trás pra frente"));
    r2.appendChild(el("p","muted","Agora olha ONDE caiu a batida, contando do fim da palavra pro começo: última = oxítona, penúltima = paroxítona, antepenúltima = proparoxítona."));
    g.appendChild(r2);

    var r3 = el("div","regra");
    r3.appendChild(el("div","nome","3. Tamanho não diz nada!"));
    r3.appendChild(el("p","muted","Palavra comprida NÃO é proparoxítona por ser comprida. “Refrigerante” tem 5 sílabas e é paroxítona. O que decide é só a batida forte."));
    g.appendChild(r3);

    var citacao = el("div","citacao","Brook, com a baqueta no ar: “Vamos testar com TESOURA. Ô, te-SOU-raaa!”");

    var modelo = el("div","fb"); modelo.setAttribute("data-k","modelo");
    modelo.appendChild(el("b",null,"\u{1F3B5} Brook pensa alto: "));
    modelo.appendChild(document.createTextNode(
      "primeiro eu separo batendo palma: te / sou / ra — três sílabas. Depois eu chamo a palavra de longe: “te-SOU-ra!”. A minha voz subiu no SOU, então essa é a forte. " +
      "Agora eu conto de trás pra frente: “ra” é a última, “sou” é a penúltima. A batida caiu na penúltima, então tesoura é PAROXÍTONA. " +
      "Repara que eu nunca olhei o tamanho da palavra nem procurei acento — eu escutei onde a voz subiu."));

    return card(
      navbar("A regra", function(){ vai(0); }),
      eyebrow("A regra"),
      el("h2",null,"Onde cai a batida da palavra"),
      silabas(["te","SOU","ra"], 1, ["antepenúltima","penúltima","última"]),
      el("p",null,"Toda palavra com duas sílabas ou mais tem uma sílaba mais forte: a sílaba tônica. Descobrir qual é resolve a questão inteira."),
      g,
      el("p","muted","Vê o Brook achando a batida, passo a passo:"),
      citacao, modelo,
      el("p","muted","Mais três exemplos, pra ouvir a diferença:"),
      silabas(["ca","FÉ"], 1, ["penúltima","última"]),
      el("p","muted","café → batida na ÚLTIMA = oxítona"),
      silabas(["ban","DEI","ra"], 1, ["antepenúltima","penúltima","última"]),
      el("p","muted","bandeira → batida na PENÚLTIMA = paroxítona"),
      silabas(["MÚ","si","ca"], 0, ["antepenúltima","penúltima","última"]),
      el("p","muted","música → batida na ANTEPENÚLTIMA = proparoxítona (e proparoxítona SEMPRE leva acento)"),
      botao("Entendi, quero treinar →", function(){ vai(2); })
    );
  }

  function montaOpcoes(q, ops, onEscolher){
    q.opcoes.forEach(function(txt,i){
      var b = el("button",null,txt);
      b.addEventListener("click", function(){ if(!b.disabled) onEscolher(i,b); });
      ops.appendChild(b);
    });
  }

  /* ---------- 3. treino guiado ---------- */
  function treino(){
    var idx = S.iG;
    if(idx >= GUIADO.length){
      return card(
        navbar("Treino guiado", function(){ pula("iG", GUIADO.length-1); }),
        eyebrow("Treino guiado"), el("h2",null,"Ritmo pegado!"),
        el("p",null,"Você já acha a batida forte com ajuda. Agora é sem dica — e com as pegadinhas de palavra comprida."),
        botao("Ir pro desafio →", function(){ vai(3); }));
    }
    var q = GUIADO[idx], feito = S.guiado[idx];
    var c = el("div","card");
    c.appendChild(navbar("Treino · " + (idx+1) + " de " + GUIADO.length, function(){
      if(idx > 0) pula("iG", idx-1); else vai(1);
    }));
    if(q.contexto) c.appendChild(el("div","contexto", q.contexto));
    if(q.silabas) c.appendChild(silabas(q.silabas, q.forte, q.rotulos));
    c.appendChild(el("h2",null,q.pergunta));

    var ops = el("div", opcoesClasse(q.opcoes.length));
    var fb = el("div","fb"); fb.style.display="none";
    var tentativa = 0;

    function trava(){ Array.prototype.forEach.call(ops.children,function(x){ x.disabled=true; }); }
    function proxima(){ c.appendChild(botao("Próxima →", function(){ pula("iG", idx+1); window.scrollTo(0,0); })); }
    function diz(k, negrito, resto){
      fb.style.display=""; fb.setAttribute("data-k",k); fb.innerHTML="";
      fb.appendChild(el("b",null,negrito)); fb.appendChild(document.createTextNode(resto));
    }

    montaOpcoes(q, ops, function(i,b){
      if(i === q.certa){
        b.setAttribute("data-state","ok"); trava();
        diz("ok","Isso mesmo! ", q.porque);
        S.guiado[idx] = {feito:true, acertou: tentativa===0}; salva();
        proxima();
      } else {
        tentativa++;
        b.setAttribute("data-state","no");
        if(tentativa === 1){
          diz("dica","Quase. ", q.dica + " Tenta de novo.");
        } else {
          ops.children[q.certa].setAttribute("data-state","ok"); trava();
          diz("no","A certa era: “" + q.opcoes[q.certa] + "”. ", q.porque);
          S.guiado[idx] = {feito:true, acertou:false}; salva();
          proxima();
        }
      }
    });
    c.appendChild(ops); c.appendChild(fb);

    if(feito){
      ops.children[q.certa].setAttribute("data-state","ok"); trava();
      diz(feito.acertou ? "ok" : "no",
          feito.acertou ? "Você acertou de primeira. " : "Aqui você precisou de dica. ",
          q.porque);
      proxima();
    }
    return c;
  }

  /* ---------- 4. desafio ---------- */
  function desafio(){
    var idx = S.iD;
    if(idx >= DESAFIO.length){
      var acertos = 0; for(var k in S.desafio) if(S.desafio[k] && S.desafio[k].acertou) acertos++;
      return card(
        navbar("Desafio", function(){ pula("iD", DESAFIO.length-1); }),
        eyebrow("Desafio"), el("h2",null,"Música pronta! \u{1F941}"),
        el("p",null,"Você respondeu " + acertos + " de " + DESAFIO.length + " certas de primeira."),
        botao("Última parada →", function(){ vai(4); }));
    }
    var q = DESAFIO[idx], feito = S.desafio[idx];
    var c = el("div","card");
    c.appendChild(navbar("Desafio · " + (idx+1) + " de " + DESAFIO.length, function(){
      if(idx > 0) pula("iD", idx-1); else pula("iG", GUIADO.length, 2);
    }));
    if(q.contexto) c.appendChild(el("div","contexto", q.contexto));
    if(q.silabas) c.appendChild(silabas(q.silabas, q.forte, q.rotulos));
    c.appendChild(el("h2",null,q.pergunta));

    var ops = el("div", opcoesClasse(q.opcoes.length));
    var fb = el("div","fb"); fb.style.display="none";
    function resolve(certo, negrito){
      Array.prototype.forEach.call(ops.children,function(x,i){
        x.disabled = true;
        if(i === q.certa) x.setAttribute("data-state","ok");
      });
      fb.style.display=""; fb.setAttribute("data-k", certo?"ok":"no"); fb.innerHTML="";
      fb.appendChild(el("b",null,negrito));
      fb.appendChild(document.createTextNode(q.nota));
      c.appendChild(botao("Próxima →", function(){ pula("iD", idx+1); window.scrollTo(0,0); }));
    }
    montaOpcoes(q, ops, function(i,b){
      var certo = i === q.certa;
      if(!certo) b.setAttribute("data-state","no");
      S.desafio[idx] = {acertou:certo, marcou:q.opcoes[i]}; salva();
      resolve(certo, certo ? "Certo! " : "Essa não é a melhor resposta. ");
    });
    c.appendChild(ops); c.appendChild(fb);

    if(feito){
      if(!feito.acertou){
        Array.prototype.forEach.call(ops.children,function(x){ if(x.textContent === feito.marcou) x.setAttribute("data-state","no"); });
      }
      resolve(feito.acertou, feito.acertou ? "Você acertou: “" + q.opcoes[q.certa] + "”. " : "Você marcou “" + feito.marcou + "”, mas a melhor resposta era “" + q.opcoes[q.certa] + "”. ");
    }
    return c;
  }

  /* ---------- 5. explique como Droidec ---------- */
  function explicacao(){
    var c2 = el("div","card");
    c2.appendChild(navbar("Explicação", function(){ pula("iD", DESAFIO.length-1, 3); }));
    c2.appendChild(eyebrow("Explique como Droidec"));
    c2.appendChild(el("h2",null,"Como você explicaria isso pro Brook?"));
    c2.appendChild(el("p","lead","Aparece a palavra CADERNO, que não tem acento nenhum. O Brook não faz ideia de onde bater o tambor. Explica pra ele, com as TUAS palavras, o passo a passo pra descobrir a sílaba forte e dizer se a palavra é oxítona, paroxítona ou proparoxítona."));
    var chips = el("div","chips");
    ["falar chamando","bater palma em cada sílaba","contar de trás pra frente"].forEach(function(t){ chips.appendChild(el("span","chip",t)); });
    c2.appendChild(el("p","muted","Tenta usar estas palavras:"));
    c2.appendChild(chips);
    var ta = el("textarea"); ta.value = S.texto || "";
    ta.setAttribute("placeholder","Brook, primeiro você...");
    var cont = el("div","contador","0 letras");
    var b = botao("Terminei →", function(){ vai(5); });
    b.disabled = true; b.style.opacity = ".45";
    function check(){
      S.texto = ta.value; salva();
      var n = ta.value.trim().length;
      cont.textContent = n + " letras" + (n<40 ? " — escreve mais um pouquinho" : " — pode seguir!");
      b.disabled = n < 40; b.style.opacity = n < 40 ? ".45" : "1";
    }
    ta.addEventListener("input", check);
    c2.appendChild(ta); c2.appendChild(cont); c2.appendChild(b);
    check();
    return c2;
  }

  /* ---------- 6. fim ---------- */
  function fim(){
    var tg=0, ag=0, td=0, ad=0, i;
    for(i=0;i<GUIADO.length;i++){ if(S.guiado[i]){ tg++; if(S.guiado[i].acertou) ag++; } }
    for(i=0;i<DESAFIO.length;i++){ if(S.desafio[i]){ td++; if(S.desafio[i].acertou) ad++; } }
    var total = tg+td, acertos = ag+ad;

    var c = el("div","card");
    c.appendChild(navbar("Fim da rota", function(){ vai(4); }));
    c.appendChild(eyebrow("Fim da rota"));
    c.appendChild(el("h2",null,"Tambor do Brook, afinado \u{1F3B5}"));
    var pl = el("div","placar"); pl.appendChild(document.createTextNode(acertos + "/" + total));
    pl.appendChild(el("small",null,"acertos de primeira"));
    c.appendChild(pl);

    var msg = "Você já acha a batida forte sem depender do acento escrito — era esse o pulo do gato.";
    if(ad <= 4) msg = "As palavras compridas ainda enganam. Antes da próxima folha, fala cada palavra em voz alta chamando, e só depois classifica.";
    if(acertos === total) msg = "Você acertou tudo de primeira, inclusive as pegadinhas de palavra comprida que não é proparoxítona.";
    c.appendChild(el("p",null, msg + " Agora pega a tua folha e refaz em voz alta: fala cada palavra chamando, escuta onde a voz sobe e só então classifica."));

    c.appendChild(el("hr","linha"));
    c.appendChild(el("p","muted","Aperta o botão e manda esse resumo pro papai:"));

    var txt = ["AULA DE HOJE — Português: Sílaba tônica — oxítona, paroxítona e proparoxítona (O Tambor do Brook)",
               "Data: " + new Date().toLocaleDateString("pt-BR"),
               "",
               "Treino guiado: " + ag + "/" + tg + " de primeira",
               "Desafio: " + ad + "/" + td + " de primeira",
               "TOTAL: " + acertos + "/" + total,
               ""];
    var errou = [];
    for(i=0;i<DESAFIO.length;i++) if(S.desafio[i] && !S.desafio[i].acertou) errou.push("Desafio " + (i+1) + ": marcou “" + S.desafio[i].marcou + "”, era “" + DESAFIO[i].opcoes[DESAFIO[i].certa] + "”");
    for(i=0;i<GUIADO.length;i++) if(S.guiado[i] && !S.guiado[i].acertou) errou.push("Treino " + (i+1) + " (precisou de dica)");
    txt.push("Errou / tropeçou:");
    txt.push(errou.length ? "- " + errou.join("\n- ") : "- nada");
    txt.push("", "EXPLICAÇÃO DO ZION (na íntegra):", (S.texto||"").trim() || "(não escreveu)");
    var resumo = txt.join("\n");

    var ta = el("textarea","resumo"); ta.value = resumo; ta.setAttribute("readonly","");
    var b = botao("📋 Copiar resumo pro papai", function(){
      ta.select();
      var ok = false;
      try{ ok = document.execCommand("copy"); }catch(e){}
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(resumo).then(function(){}, function(){}); ok = true; }
      b.textContent = ok ? "✅ Copiado! Manda pro papai" : "Seleciona o texto abaixo e copia";
    });
    c.appendChild(b);
    c.appendChild(ta);

    var reset = el("button","ghost","Começar tudo de novo");
    reset.addEventListener("click", function(){
      S = JSON.parse(JSON.stringify(VAZIO)); salva(); render(); window.scrollTo(0,0);
    });
    c.appendChild(reset);
    return c;
  }

  render();
})();
</script>
